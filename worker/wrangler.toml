name = "planning-gcal"
main = "index.js"
compatibility_date = "2026-05-20"
observability = { enabled = true }
account_id = "686385718410239110ea2fe1bccf43be"

[[kv_namespaces]]
binding = "PLANNING_DB"
id = "8c380577a5d8482c95ef6aceea259b55"

# Rappels d'expiration des heures : tous les jours à 7h UTC (8h ou 9h à Paris)
[triggers]
crons = ["0 7 * * *"]

# Code de vérification de l'email à l'inscription : actif quand MAIL_FROM est défini, par ex.
# « planning franceinfo <noreply@mon-domaine.fr> » (domaine vérifié chez Resend). À créer dans
# Cloudflare comme secret (Settings → Variables and Secrets → type Secret) : un secret n'est pas effacé
# par les déploiements, contrairement à une variable en texte. Le mail « mot de passe oublié » l'utilise aussi.
