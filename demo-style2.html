<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo style</title>
<style>
:root{--bg0:#1a1a1a;--bg2:#252525;--bg3:#373737;--text:#f4f4f4;--text2:#d8d8d8;--text3:#9a9a9a;--border:rgba(255,255,255,.12);
--blue:#62aadc;--work:#1e3850;--green:#6a9878;--rend:#A8BF7A;--amber:#e09830;--red:#c0392b;--gold:#b8941e;--purple:#9c7fe0;--tile:rgba(255,255,255,.045)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:12px 0 40px}
.pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;max-width:420px;padding:0 10px}
.pick label{display:flex;align-items:center;gap:6px;border:1px solid #3a3a3a;background:#161616;color:#ccc;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;user-select:none}
.pick input{accent-color:#62aadc}
.pick label:has(input:checked){border-color:#62aadc;color:#fff}
.app{width:100%;max-width:400px;background:var(--bg0);border-radius:26px;padding:14px 12px 18px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative}
.nav{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.mt{font-size:16px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--bg2);border:.5px solid var(--border);border-radius:16px;padding:8px 6px;position:relative}
.dh{text-align:center;font-size:10px;color:var(--text3);padding-bottom:4px}
.c{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.c small{font-size:9.5px;font-weight:500;color:var(--text2);margin-top:1px}
.c.v{background:var(--work)}
.c.f{background:var(--work);box-shadow:inset 0 0 0 1.5px var(--gold)}
.c.rh small{color:var(--text3)}
.c.o{opacity:.3}
.c.t{outline:1.5px solid var(--blue);outline-offset:-1.5px}
.c.rd{background:rgba(168,191,122,.45)}
.c.cg{background:#243828}.c.cg small{color:#9fd0ae}
.side{display:flex;gap:10px;margin-top:14px}
.vm{width:26px;display:flex;align-items:flex-end;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.45}
.vm b{font-size:24px;line-height:.72;font-weight:900;font-style:italic;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);-webkit-text-stroke:2px var(--gold);paint-order:stroke fill}
.vm b i{font-size:.42em;font-weight:700;-webkit-text-stroke:1px var(--gold);margin-inline-start:.3em;opacity:.75;font-style:italic}
.blocks{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.bloc{background:var(--bg2);border:.5px solid var(--border);border-radius:16px;padding:10px;position:relative}
.bt{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.cols{display:flex;gap:6px}
.col{flex:1;background:var(--tile);border-radius:10px;padding:7px 4px 6px;text-align:center;position:relative}
.col span{display:block;font-size:9px;color:var(--text3)}
.col b{display:block;font-size:16px;font-weight:600;margin:1px 0;font-variant-numeric:tabular-nums}
.col i{display:block;font-style:normal;font-size:9px;color:var(--text3)}
.ring{display:none}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px}
.chip{font-size:10.5px;background:var(--bg3);border-radius:999px;padding:3px 9px;color:var(--text2)}.chip b{color:var(--amber)}
.tag{font-size:11px;color:#888;margin-top:12px;text-align:center;max-width:390px;line-height:1.55;padding:0 12px}

/* ── Profondeur : relief doux sur les cases et les blocs ── */
.depth .c.v,.depth .c.f{background:linear-gradient(165deg,#28486a,#1b3249);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.35)}
.depth .c.f{box-shadow:inset 0 0 0 1.5px var(--gold),inset 0 1px 0 rgba(255,255,255,.08)}
.depth .c.rd{background:linear-gradient(165deg,rgba(168,191,122,.55),rgba(168,191,122,.35));box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.depth .bloc,.depth .cal{background:linear-gradient(180deg,#292929,#212121);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.depth .col{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ── Lumière : halo coloré en fond et lueur sur les chiffres ── */
.glow .app::before{content:"";position:absolute;inset:-40px;background:radial-gradient(circle at 15% 0%,rgba(98,170,220,.16),transparent 45%),radial-gradient(circle at 100% 70%,rgba(184,148,30,.10),transparent 40%);pointer-events:none}
.glow .col b{text-shadow:0 0 14px currentColor}
.glow .c.t{box-shadow:0 0 14px rgba(98,170,220,.45)}
.glow .app>*{position:relative}

/* ── Verre : blocs translucides et flous (façon iOS) ── */
.glass .bloc,.glass .cal{background:rgba(40,40,44,.55);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:.5px solid rgba(255,255,255,.1)}
.glass .col{background:rgba(255,255,255,.05)}
.glass .app{background:radial-gradient(circle at 20% 10%,#1d2a3a,transparent 50%),radial-gradient(circle at 90% 80%,#2a2414,transparent 45%),#141416}

/* ── Typographie éditoriale (dans l'esprit du label du mois) ── */
.typo .mt{font-size:21px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.typo .mt i{font-size:.5em;color:var(--gold);font-weight:700;vertical-align:.45em;margin-left:3px}
.typo .c{font-weight:800;font-style:italic;letter-spacing:-.02em}
.typo .col b{font-size:19px;font-weight:800;font-style:italic;letter-spacing:-.02em}
.typo .bt{font-weight:800;font-style:italic;letter-spacing:.07em;color:var(--text2)}

/* ── Jour actuel en or ── */
.gold .c.t{outline:none;background:linear-gradient(165deg,#4a3b10,#2e250a);color:#f1d36a;box-shadow:0 0 0 1.5px var(--gold),0 0 12px rgba(184,148,30,.35)}
.gold .c.t small{color:#f1d36a}

/* ── Week-ends teintés ── */
.wkend .c.we:not(.v):not(.f):not(.rd):not(.cg){background:rgba(255,255,255,.035)}
.wkend .dh.we{color:var(--text2)}

/* ── Anneaux de progression ── */
.rings .col{padding:6px 2px 6px}
.rings .ring{display:block;width:54px;height:54px;margin:0 auto 4px}
.rings .col b{position:absolute;top:6px;left:0;right:0;height:54px;line-height:54px;margin:0;font-size:12.5px}
.rings .col span{margin-top:0}
</style>
</head>
<body>
<div class="pick" id="pick">
  <label><input type="checkbox" data-k="depth" checked>Profondeur</label>
  <label><input type="checkbox" data-k="glow" checked>Lumière</label>
  <label><input type="checkbox" data-k="glass">Verre</label>
  <label><input type="checkbox" data-k="typo">Typo éditoriale</label>
  <label><input type="checkbox" data-k="gold">Jour en or</label>
  <label><input type="checkbox" data-k="wkend" checked>Week-ends teintés</label>
  <label><input type="checkbox" data-k="rings">Anneaux</label>
</div>
<div id="wrap">
<div class="app">
  <div class="top"><div class="nav">‹</div><div class="mt">Octobre<i> 2026</i></div><div class="nav">›</div></div>
  <div class="cal" id="cal"></div>
  <div class="side">
    <div class="vm"><b>Octobre<i>26</i></b></div>
    <div class="blocks">
      <div class="bloc">
        <div class="bt">Soldes</div>
        <div class="cols">
          <div class="col">__R1__<span>matelas</span><b style="color:var(--blue)">162h16</b><i>heures</i></div>
          <div class="col">__R2__<span>dispo en octobre</span><b style="color:var(--rend)">25h23</b><i style="color:var(--red)">18h00 expirent</i></div>
          <div class="col">__R3__<span>congés 2026</span><b style="color:var(--green)">8j</b><i>restants</i></div>
        </div>
      </div>
      <div class="bloc">
        <div class="bt">Variables <span style="text-transform:none;letter-spacing:0">• payées en novembre</span></div>
        <div class="cols">
          <div class="col">__R4__<span>rendus</span><b style="color:var(--rend)">4h00</b><i>acquis</i></div>
          <div class="col">__R5__<span>heures sup</span><b style="color:var(--text3)">—</b><i>payées</i></div>
          <div class="col">__R6__<span>nuit</span><b style="color:var(--purple)">20h00</b><i>payées</i></div>
        </div>
        <div class="chips"><span class="chip">antenne <b>×15</b></span><span class="chip">matin <b>×5</b></span><span class="chip">panier <b>×3</b></span></div>
      </div>
    </div>
  </div>
</div>
</div>
<div class="tag" id="tag"></div>
<script>
// Anneaux : part remplie (0 à 1) et couleur de chaque tuile
const ring=(p,c)=>{const r=22,L=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(L*p)+' '+L+'" transform="rotate(-90 26 26)"/></svg>';};
const app=document.querySelector('.app');
// matelas : part du stock de départ ; dispo : part non menacée par l'expiration ; congés : 8/30 restants ; rendus / nuit : part du mois
app.innerHTML=app.innerHTML.replace('__R1__',ring(.89,'#62aadc')).replace('__R2__',ring(.29,'#A8BF7A')).replace('__R3__',ring(8/30,'#6a9878')).replace('__R4__',ring(.4,'#A8BF7A')).replace('__R5__',ring(0,'#62aadc')).replace('__R6__',ring(.6,'#9c7fe0'));
const days=['L','M','Me','J','V','S','D'];
const cells=[[28,'','o'],[29,'','o'],[30,'A2','o v'],[1,'A2','v t'],[2,'B1','v'],[3,'',''],[4,'RH','rh'],
[5,'A3','v'],[6,'A3','v'],[7,'',''],[8,'RH','rh'],[9,'A1','v'],[10,'As2','v'],[11,'Ad2','v'],
[12,'Rendu','rd'],[13,'',''],[14,'A1','v'],[15,'A1','v'],[16,'A3','v'],[17,'',''],[18,'RH','rh'],
[19,'B1','v'],[20,'B1','v'],[21,'A3','v'],[22,'A3','v'],[23,'Congé','cg'],[24,'',''],[25,'RH','rh'],
[26,'A2','v'],[27,'A2','v'],[28,'B1','v'],[29,'B1','v'],[30,'',''],[31,'',''],[1,'A1','f']];
document.getElementById('cal').innerHTML=days.map((d,i)=>'<div class="dh'+(i>4?' we':'')+'">'+d+'</div>').join('')+cells.map((c,i)=>'<div class="c '+c[2]+(i%7>4?' we':'')+'">'+c[0]+(c[1]?'<small>'+c[1]+'</small>':'')+'</div>').join('');
const notes={depth:'Profondeur : léger relief sur les cases et les tuiles, ombre douce sous les blocs.',glow:'Lumière : halos colorés discrets en fond, lueur sur les chiffres et le jour actuel.',glass:'Verre : blocs translucides et flous sur un fond coloré, façon iOS.',typo:'Typo éditoriale : italique gras comme le label du mois, pour le titre, les jours et les chiffres.',gold:'Jour en or : le jour actuel en doré lumineux au lieu du cadre bleu.',wkend:'Week-ends teintés : samedis et dimanches non travaillés très légèrement éclairés.',rings:'Anneaux : la part remplie autour de chaque chiffre (congés 8/30, dispo non menacé par l’expiration, etc.).'};
const wrap=document.getElementById('wrap'),tag=document.getElementById('tag');
function upd(){const on=[...document.querySelectorAll('#pick input')].filter(x=>x.checked).map(x=>x.dataset.k);wrap.className=on.join(' ');tag.innerHTML=on.length?on.map(k=>notes[k]).join('<br>'):'Actuel (rien d’activé).';}
document.querySelectorAll('#pick input').forEach(x=>x.onchange=upd);upd();
</script>
</body>
</html>
