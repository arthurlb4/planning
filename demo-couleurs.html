<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo couleurs</title>
<style>
:root{--bg0:#1a1a1a;--bg2:#252525;--text:#f4f4f4;--text2:#d8d8d8;--text3:#9a9a9a;--gold:#b8941e;--rend:#A8BF7A;--work:#1a3050}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:14px 0 40px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;width:100%;max-width:400px;padding:0 12px}
.pick button{display:flex;align-items:center;gap:6px;border:1px solid #444;background:#1c1c1c;color:#ddd;border-radius:10px;padding:8px;font-size:12px;cursor:pointer;text-align:left}
.pick button i{width:16px;height:16px;border-radius:4px;flex:none}
.pick button.on{border-color:#fff;color:#fff}
.app{width:100%;max-width:400px;background:var(--bg0);border-radius:22px;padding:14px 12px}
.mt{text-align:center;font-weight:600;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--bg2);border:.5px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 6px}
.dh{text-align:center;font-size:10px;color:var(--text3);padding-bottom:4px}
.c{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.c small{font-size:9.5px;font-weight:500;color:var(--text2);margin-top:1px}
.c.v{background:var(--work)}
.c.f{background:var(--work);box-shadow:inset 0 0 0 1.5px var(--gold)}
.c.rh small{color:var(--text3)}
.c.o{opacity:.3}
.c.t{outline:1.5px solid #62aadc;outline-offset:-1.5px}
.c.rd{background:rgba(168,191,122,.45)}.c.rd small{color:var(--text)}
.c.cg{background:#243828}.c.cg small{color:#9fd0ae}
.tag{font-size:11px;color:#888;margin-top:12px;text-align:center;max-width:380px;line-height:1.5;padding:0 12px}
</style>
</head>
<body>
<div class="pick" id="pick"></div>
<div class="app">
  <div class="mt">Octobre 2026</div>
  <div class="cal" id="cal"></div>
</div>
<div class="tag" id="tag"></div>
<script>
const opts=[
 ['Actuel','#1a3050','Le bleu d’aujourd’hui, qui tire légèrement vers le cyan.'],
 ['Bleu roi','#1e2c5a','Un cran plus vers le violet, plus profond.'],
 ['Outremer','#232a62','Bleu outremer : nettement plus chaud, encore bien bleu.'],
 ['Ardoise','#2a3054','Bleu ardoise chaud, plus doux et moins saturé.'],
 ['Indigo','#29285c','Indigo : le plus chaud tout en restant bleu.'],
 ['Pervenche','#2f3266','Pervenche sombre : un peu plus clair, les cases ressortent davantage.'],
];
const days=['L','M','Me','J','V','S','D'];
const cells=[[28,'','o'],[29,'','o'],[30,'A2','o v'],[1,'A2','v t'],[2,'B1','v'],[3,'',''],[4,'RH','rh'],
[5,'A3','v'],[6,'A3','v'],[7,'',''],[8,'RH','rh'],[9,'A1','v'],[10,'As2','v'],[11,'Ad2','v'],
[12,'Rendu','rd'],[13,'',''],[14,'A1','v'],[15,'A1','v'],[16,'A3','v'],[17,'',''],[18,'RH','rh'],
[19,'B1','v'],[20,'B1','v'],[21,'A3','v'],[22,'A3','v'],[23,'Congé','cg'],[24,'',''],[25,'RH','rh'],
[26,'A2','v'],[27,'A2','v'],[28,'B1','v'],[29,'B1','v'],[30,'',''],[31,'',''],[1,'A1','f']];
document.getElementById('cal').innerHTML=days.map(d=>'<div class="dh">'+d+'</div>').join('')+cells.map(c=>'<div class="c '+c[2]+'">'+c[0]+(c[1]?'<small>'+c[1]+'</small>':'')+'</div>').join('');
const pick=document.getElementById('pick'),tag=document.getElementById('tag');
pick.innerHTML=opts.map((o,i)=>'<button data-i="'+i+'"><i style="background:'+o[1]+'"></i>'+o[0]+'</button>').join('');
function set(i){document.documentElement.style.setProperty('--work',opts[i][1]);tag.textContent=opts[i][0]+' — '+opts[i][2]+' (1er novembre : exemple de férié travaillé, liseré doré)';pick.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));}
pick.querySelectorAll('button').forEach(b=>b.onclick=()=>set(+b.dataset.i));
set(2);
</script>
</body>
</html>
