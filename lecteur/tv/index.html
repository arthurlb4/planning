<script>
// Version télé du lecteur, toujours à jour depuis le site ; sans réseau vers le site, la copie du paquet
(function () {
  var URL = 'https://franceinfoplanning.com/iptv/tv.html', done = false;
  function local() { if (done) return; done = true; location.replace('tv.html'); }
  var timer = setTimeout(local, 10000);
  var x = new XMLHttpRequest();
  x.open('GET', URL + '?t=' + Date.now());
  x.timeout = 9000;
  x.onload = function () {
    if (done) return;
    if (x.status === 200 && x.responseText.indexOf('Lecteur IPTV · TV') > 0) {
      done = true; clearTimeout(timer);
      document.open(); document.write(x.responseText); document.close();
    } else local();
  };
  x.onerror = x.ontimeout = local;
  x.send();
})();
</script>
