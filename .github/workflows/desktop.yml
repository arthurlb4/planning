name: Appli Windows (Lecteur IPTV)

# Fabrique Lecteur-IPTV.exe sur un serveur Windows et le met en téléchargement
# (onglet Releases du dépôt, version « iptv-desktop », toujours remplacée par la dernière).
on:
  push:
    branches: [main]
    paths:
      - 'lecteur/desktop/**'
      - 'lecteur/iptv/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copie de secours de la page (si le site est injoignable)
        run: copy lecteur\iptv\index.html lecteur\desktop\index.html
        shell: cmd

      # mpv : lecteur vidéo intégré à l'appli (films, épisodes, torrents), dernière compilation Windows 64 bits de
      # shinchiro/mpv-winbuild-cmake ; en cas d'échec l'installateur est fait quand même (l'appli garde l'ancien lecteur)
      - name: mpv (lecteur vidéo intégré)
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lecteur/desktop/mpv
          a=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets -q '.assets[].name' | grep -E '^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$' | head -1)
          echo "mpv : $a"
          gh release download --repo shinchiro/mpv-winbuild-cmake -p "$a" -D mpvdl
          7z x "mpvdl/$a" -olecteur/desktop/mpv -y > /dev/null
          ls -la lecteur/desktop/mpv | head -20
          test -f lecteur/desktop/mpv/mpv.exe

      - name: Fabriquer l'exe
        working-directory: lecteur/desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Mettre en téléchargement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view iptv-desktop >/dev/null 2>&1 || gh release create iptv-desktop --title "Lecteur IPTV pour Windows" --notes "Télécharger Lecteur-IPTV-Installation.exe ci-dessous et l'ouvrir : installation dans votre profil, raccourcis Bureau et menu Démarrer."
          # latest.yml en dernier : l'appli ne voit la nouvelle version qu'une fois l'installateur en ligne
          gh release upload iptv-desktop lecteur/desktop/dist/Lecteur-IPTV-Installation.exe lecteur/desktop/dist/Lecteur-IPTV-Installation.exe.blockmap --clobber
          gh release upload iptv-desktop lecteur/desktop/dist/latest.yml --clobber
          gh release delete-asset iptv-desktop Lecteur-IPTV.exe -y 2>/dev/null || true
