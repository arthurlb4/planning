name: Appli Windows native (Lecteur IPTV)

# Fabrique l'appli native (lecteur/natif : page dans WebView2, vidéo par mpv dans la même fenêtre) sur un serveur Windows,
# avec le serveur local de l'appli Electron (Node, torrents, conversion), et la met en téléchargement (version « iptv-natif »).
on:
  push:
    branches: [main]
    paths:
      - 'lecteur/natif/**'
      - 'lecteur/desktop/remux.js'
      - 'lecteur/desktop/torrent.js'
      - 'lecteur/desktop/torrent-proc.js'
      - 'lecteur/desktop/backend.js'
      - 'lecteur/desktop/ranger.js'
      - 'lecteur/mediatheque/**'
      - 'lecteur/desktop/icon.ico'
      - 'lecteur/desktop/package.json'
      - '.github/workflows/natif.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-natif
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # même numéro que l'appli Windows classique (package.json), plus un numéro de construction caché (mise à jour automatique
      # d'une correction propre à l'appli native, publiée sous le même numéro)
      - name: Numéro de version
        shell: bash
        run: echo "NATIF_VER=$(node -p "require('./lecteur/desktop/package.json').version").${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # outil .NET déjà installé sur les serveurs Windows de GitHub (son installation restait parfois bloquée)
      - name: Appli (C#)
        run: dotnet --list-sdks; dotnet publish lecteur/natif/LecteurNatif.csproj -c Release -r win-x64 --self-contained true -o build/app -p:Version=${{ env.NATIF_VER }}

      - name: Serveur local (Node, torrents, conversion)
        shell: bash
        run: |
          mkdir -p build/app/backend build/app/node
          cp lecteur/desktop/{remux,torrent,torrent-proc,backend,ranger}.js build/app/backend/
          mkdir -p build/app/mediatheque && cp lecteur/mediatheque/{installer.ps1,LISEZ-MOI.md,Guide.html,Guide.txt} build/app/mediatheque/
          cd build/app/backend
          echo '{"name":"lecteur-backend","private":true,"dependencies":{"webtorrent":"1.9.7","ffmpeg-static":"5.2.0"}}' > package.json
          npm install --omit=dev --no-audit --no-fund
          cp "$(which node)" ../node/node.exe
          ls ../node

      - name: mpv
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          a=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets -q '.assets[].name' | grep -E '^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$' | head -1)
          gh release download --repo shinchiro/mpv-winbuild-cmake -p "$a" -D mpvdl
          7z x "mpvdl/$a" -obuild/app/mpv -y > /dev/null
          test -f build/app/mpv/mpv.exe

      - name: Installateur
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null; $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
          $env:APP_VERSION = $env:NATIF_VER
          iscc lecteur/natif/installer.iss
          Get-ChildItem build/*.exe

      # version portable : le dossier de l'appli dans un .zip, avec portable.txt (réglages gardés dans « donnees » à côté)
      - name: Version portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/portable/Lecteur IPTV" | Out-Null
          Copy-Item -Recurse -Force build/app/* "build/portable/Lecteur IPTV/"
          Set-Content -Encoding utf8 "build/portable/Lecteur IPTV/portable.txt" "Version portable : vos reglages, listes et historique sont dans le dossier « donnees ». Pour une nouvelle version, remplacez tout sauf ce dossier."
          7z a build/Lecteur-IPTV-Portable.zip "./build/portable/Lecteur IPTV" | Out-Null
          Get-Item build/Lecteur-IPTV-Portable.zip

      - name: Mettre en téléchargement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view iptv-natif >/dev/null 2>&1 || gh release create iptv-natif --prerelease --title "Lecteur IPTV pour Windows (natif, essai)" --notes "Version native en essai : la page de l'appli et la vidéo (mpv) dans la même fenêtre. Télécharger Lecteur-IPTV-Natif-Installation.exe ci-dessous et l'ouvrir."
          gh release upload iptv-natif build/Lecteur-IPTV-Natif-Installation.exe --clobber
          gh release upload iptv-natif build/Lecteur-IPTV-Portable.zip --clobber
          # installateur propre à cette version, pour la mise à jour automatique (jamais remplacé pendant un téléchargement) ;
          # seuls les deux derniers sont gardés
          v="$NATIF_VER"
          cp build/Lecteur-IPTV-Natif-Installation.exe "build/Lecteur-IPTV-Natif-$v.exe"
          gh release upload iptv-natif "build/Lecteur-IPTV-Natif-$v.exe" --clobber
          gh release view iptv-natif --json assets -q '.assets[].name' | grep -E '^Lecteur-IPTV-Natif-[0-9]+(\.[0-9]+)+\.exe$' | sort -V | head -n -2 | while read -r old; do gh release delete-asset iptv-natif "$old" -y || true; done
          # version publiée, lue par l'appli pour se mettre à jour toute seule (envoyée après l'installateur)
          echo "$NATIF_VER" > build/natif-version.txt
          gh release upload iptv-natif build/natif-version.txt --clobber
