name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # relance à la main (onglet Actions) si une publication reste bloquée

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe JS
        run: node scripts/check.js

      - name: Contrôler les calculs d'heures et le texte du mail
        run: node tests/calc.test.js && node tests/mail.test.js

      - name: Tester les écrans (app et admin dans un navigateur)
        timeout-minutes: 8 # d'habitude moins d'une minute : au-delà, c'est un blocage (échec plutôt qu'attente de 6 h)
        # Chrome déjà installé sur les serveurs de GitHub : rien à télécharger d'autre que playwright-core (avant : polices et
        # bibliothèques depuis un miroir Ubuntu parfois très lent, qui bloquait la publication)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node tests/ui.test.js

      - name: Build deploy directory (mirror original structure)
        run: |
          mkdir -p /tmp/deploy/app
          mkdir -p /tmp/deploy/admin
          cp -r app/. /tmp/deploy/app/
          cp -r admin/. /tmp/deploy/admin/
          cp index.html /tmp/deploy/index.html
          cp apple-touch-icon.png apple-touch-icon-precomposed.png /tmp/deploy/ # icône de secours cherchée par iOS à la racine
          cp 404.html /tmp/deploy/404.html
          cp confidentialite.html /tmp/deploy/confidentialite.html
          cp conditions.html /tmp/deploy/conditions.html
          cp _headers /tmp/deploy/_headers 2>/dev/null || true
          touch /tmp/deploy/.nojekyll
          echo franceinfoplanning.com > /tmp/deploy/CNAME # domaine de l'app (sinon effacé à chaque publication)
          # Empreinte du code : adresses des fichiers partagés (?v=) et balise app-build ; un changement de code est ainsi
          # toujours vu par les iPhone (fichiers neufs, mise à jour proposée), même si le numéro de version n'a pas bougé
          H=$(cat app/index.html app/core.js app/ui.js app/style.css app/pc/index.html app/pc/pc.js app/pc/pc.css app/sw.js | sha1sum | cut -c1-10)
          for f in /tmp/deploy/app/index.html /tmp/deploy/app/pc/index.html; do
            sed -i -E "s/\?v=[0-9.]+\"/?v=$H\"/g; s/name=\"app-build\" content=\"[^\"]*\"/name=\"app-build\" content=\"$H\"/" "$f"
          done
          grep -c "app-build\" content=\"$H" /tmp/deploy/app/index.html

      - name: Push to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
