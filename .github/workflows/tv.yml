name: Appli Samsung TV (Lecteur IPTV)

# Fabrique l'appli télé signée et prête à installer (Releases du dépôt, version « iptv-tv ») :
# - Lecteur-IPTV-TV-installation.zip : appli signée + sdb + Installer-sur-la-TV.bat (double-clic, sans VS Code)
# - Lecteur-IPTV-TV.zip : le projet Tizen seul (pour VS Code et l'extension « Tizen TV »)
on:
  push:
    branches: [main]
    paths:
      - 'lecteur/tv/**'
      - 'lecteur/iptv/**'
      - 'lecteur/scripts/build-tv.js'
      - 'lecteur/scripts/sign-tv.js'
      - '.github/workflows/tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-tv
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Projet Tizen (chargeur + copie de la version télé)
        run: |
          npm install --no-save --no-package-lock esbuild@0.24.0 @tizentv/webide-common-tizentv@1.0.20 @tizentv/tools@1.1.3
          mkdir -p ../work/LecteurIPTV
          cp lecteur/tv/config.xml lecteur/tv/index.html lecteur/tv/icon.png ../work/LecteurIPTV/
          node lecteur/scripts/build-tv.js lecteur/iptv/index.html ../work/LecteurIPTV/tv.html
          cd ../work && 7z a -tzip Lecteur-IPTV-TV.zip LecteurIPTV >/dev/null
      - name: Signature et paquet d'installation
        run: |
          node lecteur/scripts/sign-tv.js ../work/LecteurIPTV ../work/Lecteur-IPTV-TV
          cp lecteur/tv/Installer-sur-la-TV.bat ../work/Lecteur-IPTV-TV/
          cd ../work && 7z a -tzip Lecteur-IPTV-TV-installation.zip Lecteur-IPTV-TV >/dev/null && ls -la
      - name: Mettre en téléchargement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view iptv-tv >/dev/null 2>&1 || gh release create iptv-tv --title "Lecteur IPTV pour Samsung TV" --notes "Lecteur-IPTV-TV-installation.zip : dézipper puis double-cliquer sur Installer-sur-la-TV.bat."
          gh release upload iptv-tv ../work/Lecteur-IPTV-TV-installation.zip ../work/Lecteur-IPTV-TV.zip --clobber
