<script>/* Ouverture (pas un « tirer pour actualiser ») : le motif de l'icône à la place de la silhouette */
try{if(!sessionStorage.getItem('ptr-ok')){var _b=document.getElementById('boot');_b.classList.add('logo');
  // app sur l'écran d'accueil : l'image de démarrage couvre tout l'écran, la page commence sous la barre d'état
  // (mesuré sur iPhone : 59 points plus bas) ; le bas de la page est le bas de l'écran
  if(navigator.standalone&&screen.height>innerHeight){var _w=Math.min(screen.width,innerWidth)||innerWidth;_b.firstChild.style.top=(innerHeight-screen.height/2-24-0.21*_w)+'px';}}}catch(e){}</script>
<script>/* Pulsation de l'écran de chargement calée sur l'horloge (même phase avant et après un rechargement) */
try{document.getElementById('boot').style.setProperty('--btd',(-(Date.now()%1300)/1000)+'s');}catch(e){}</script>
<script>/* Retour d'un « tirer pour actualiser » : l'écran de chargement garde la roue à la place du nom du mois,
   au même point de son cycle (puis l'app, dessous, la montre au même endroit) */
window._bootSpinSvg='<svg viewBox="0 0 28 28" width="28" height="28"><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(0 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.000s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(45 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.700s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(90 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.600s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(135 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.500s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(180 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.400s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(225 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.300s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(270 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.200s)"/><line x1="14" y1="3.4" x2="14" y2="8.8" transform="rotate(315 14 14)" style="animation-delay:calc(var(--ph,0s) - 0.100s)"/></svg>'; // roue de l'écran de chargement (aussi pour le fondu avant rechargement)
(function(){try{var ok=sessionStorage.getItem('ptr-ok');if(!ok)return;var t0=+ok.split(':')[1]||Date.now();}catch(e){return;}
  var b=document.getElementById('boot'),bar=b&&b.querySelector('.bt-bar');if(!bar)return;b.classList.add('ptr');
  var w=document.createElement('div');w.className='bt-ptr';w.style.setProperty('--ph',(-((Date.now()-t0)%800)/1000)+'s');
  w.innerHTML=window._bootSpinSvg;bar.appendChild(w);})();
</script>
<script>/* Écran de chargement : cases du côté placées comme au dernier affichage de l'accueil */
try{(function(){var g=JSON.parse(localStorage.getItem('pl_boot_geo')||'null');if(!g||innerWidth>720||Math.abs(g.w-innerWidth)>2)return;
var bh=document.querySelector('#boot .bt-hdr');if(bh&&g.h>20)bh.style.height=g.h+'px'; // même hauteur que la vraie barre (icônes comprises)
// boutons de l'en-tête et flèches du calendrier : mêmes places, tailles et arrondis que dans l'app
var _pl=function(par,rs,cls){[].slice.call(par.querySelectorAll(':scope > b')).forEach(function(x){x.remove();});
  rs.forEach(function(r,i){var e=document.createElement('b');if(cls&&cls[i])e.className=cls[i];e.style.cssText='position:absolute;margin:0;left:'+r[0]+'px;top:'+r[1]+'px;width:'+r[2]+'px;height:'+r[3]+'px;border-radius:'+(parseFloat(r[4])>0?r[4]:'9px');par.appendChild(e);});};
if(bh&&g.hb&&g.hb.length){_pl(bh,g.hb);} // en-tête fixé en haut (voir #boot .bt-hdr) : repère des boutons
var bb0=document.querySelector('#boot .bt-bar');if(bb0&&g.mb&&g.mt){_pl(bb0,g.mb.concat([g.mt]),g.mb.map(function(){return '';}).concat(['w']));}
// barre du mois et calendrier aux mêmes positions et tailles que dans l'app
var bi=document.querySelector('#boot .bt-in'),bb=document.querySelector('#boot .bt-bar'),bc=document.querySelector('#boot .bt-cal');
if(g.bar&&g.cal&&bi&&bb&&bc){bi.style.marginTop='0';bi.style.paddingTop=Math.max(0,g.bar[0])+'px';bb.style.height=g.bar[1]+'px';bb.style.marginBottom=(g.cal[0]-g.bar[0]-g.bar[1])+'px';
  bc.classList.add('fix');bc.style.height=g.cal[1]+'px';bc.style.marginBottom='0';}
var bl=document.querySelectorAll('#boot .bt-bloc'),sd=document.querySelector('#boot .bt-side');if(!sd||bl.length!==g.b.length)return;
var t0=bl[0].getBoundingClientRect().top;sd.style.top=(g.b[0][0]-t0)+'px';
if(g.bl!=null)sd.style.paddingLeft=g.bl+'px'; // cases du côté décalées comme dans l'app (rail du mois à gauche)
if(g.sm){sd.style.setProperty('--rt',(g.sm[0]-g.b[0][0])+'px');sd.style.setProperty('--rw',g.sm[3]+'px');sd.style.setProperty('--rh',g.sm[1]+'px');}
for(var i=0;i<bl.length;i++){bl[i].style.height=g.b[i][1]+'px';bl[i].style.marginBottom=(i<bl.length-1?g.b[i+1][0]-g.b[i][0]-g.b[i][1]:0)+'px';}})();}catch(e){}</script>
