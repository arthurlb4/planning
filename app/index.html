<style>

:root{
  --btn:rgba(255,250,243,.1);--btn-a:rgba(255,250,243,.16); /* fond commun des boutons neutres */
  --bg:transparent;--bg0:#191918;--bg2:#222221;--bg2h:#2b2b29;--bg3:#343331;
  --text:#f3f2ef;--text2:#d8d6d2;--text3:#a9a7a1;
  --border:rgba(255,250,242,.11);--border2:rgba(255,250,242,.055);
  --r:12px;--rl:16px;
  --shadow-s:0 1px 3px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.14);
  --shadow-m:0 2px 6px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.18);
  --blue:#62aadc;--blue-l:#1e3850;--blue-m:#284660;
  --green:#6a9878;--green-l:#1c2e22;--green-m:#243828;
  --orange:#c88048;--orange-l:rgba(188,120,64,.26);
  --amber:#e09830;--red:#c0392b;
  --gold:#b8941e;--gold-dark:#9a7a18;--gold-l:rgba(184,148,30,.15);--gold-b:rgba(184,148,30,.35);--gold-pay:#FFE169;
  --rend:#A8BF7A;--rend-l:rgba(168,191,122,.45);--rend-text:#A8BF7A;--rend-bar:#7ab83a;
  --teal:#2abcc8;--teal-l:rgba(42,188,200,.22);
  --fer-bg:#7a5c14;--fer-bg-light:#8f6e1a;--fer-text:#e8d5a3;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',sans-serif; /* SF Pro sur iPhone/Mac, Inter ailleurs */
  --font-num:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif; /* chiffres : SF Pro Rounded sur iPhone/Mac */
}


*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:var(--font);user-select:none;-webkit-user-select:none;}
/* No transitions - avoid flash on render */
html{scrollbar-gutter:stable;overscroll-behavior-y:none;} /* pas de rebond natif du haut de page (iPhone) : tirer pour actualiser ne fait pas glisser le calendrier */html,body{overflow-x:hidden;}body{padding-top:60px;background:var(--bg);color:var(--text);overscroll-behavior-y:none;}
@media(max-width:720px){html,body{height:100%;overflow:hidden;}}
/* Téléphone : la page ne défile pas (gestes du calendrier), sauf si son contenu dépasse l'écran (classe posée par _fitScroll) */
@media(max-width:720px){body.can-scroll{overflow-y:auto}.app-outer{padding-bottom:env(safe-area-inset-bottom)}.side-col{padding-bottom:30px!important}}
input,select,textarea{font-family:var(--font);user-select:text;-webkit-user-select:text;}button{font-family:var(--font);user-select:none;-webkit-user-select:none;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
#app{display:block;}
.app-outer{max-width:1440px;margin:0 auto;padding:0 20px;overflow-x:hidden;}
@media (orientation:portrait){body{padding-top:68px;}}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;gap:4px;position:relative;width:100%;}
.layout{display:flex;gap:0;align-items:stretch;}
.cal-col{flex:1;min-width:0;position:relative;overflow:visible;padding:0 0 20px;display:flex;flex-direction:column;align-items:stretch;}
.col-sep{display:none;}
.side-col{width:510px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;padding-top:0;padding-bottom:48px; /* place pour l'ombre de la dernière case, sinon coupée en bas de page */ padding-left:12px;position:relative;z-index:1;}
@media(max-width:720px){.layout{flex-direction:column;align-items:stretch;}.side-col{width:100%;padding-left:0;}.col-sep{display:none;}.cal-col{padding-bottom:8px;}.hdr-ver{display:none!important;}}
.layout.side-below{flex-direction:column;align-items:stretch;}
.layout.side-below .side-col{width:100%;padding-left:0;}
.layout.side-below .col-sep{display:none;}
.layout.side-below .cal-col{padding-bottom:8px;}
@media(max-width:480px){.hdr{padding:6px 10px 10px!important;}.ibtn-lbl{display:none;}body{padding-top:52px;}.hdr-btns{gap:6px!important;}.ibtn{padding:7px 9px!important;}.ibtn i{font-size:16px!important;}}
.det-mob{display:none;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;left:0;right:0;width:100%;background:var(--bg2);border-bottom:0.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.18);position:fixed;top:0;z-index:200;}

.hdr-btns{display:flex;gap:8px;align-items:center;margin-left:auto;}
.hdr-sep{width:1px;height:18px;background:var(--border);margin:0 3px;flex-shrink:0;}
.ibtn{background:transparent;border:1px solid rgba(128,128,128,.38);border-radius:var(--r);padding:8px 11px;font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px;transition:background .1s;}
.ibtn i{font-size:16px;}
.ibtn:active{opacity:.7;}
.ibtn:disabled{opacity:.3;pointer-events:none;}
/* ── Liquid Glass : barre du haut et boutons (icônes, navigation des mois) ── */
.ibtn,.mnav{background:rgba(255,250,243,.05);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:.5px solid rgba(255,250,243,.09);
  box-shadow:inset .5px .5px 0 rgba(255,250,243,.15),inset -.5px -.5px 0 rgba(255,250,243,.05)}
@media(hover:hover){.ibtn:hover,.mnav:hover{background:rgba(255,250,243,.09)}}
/* Bouton « auj. » : il apparaît/disparaît en fondu ; sans flou d'arrière-plan (sur fond uni il ne se voit pas), le fondu ne casse plus son liseré sur iPhone */
.mnav.today{-webkit-backdrop-filter:none;backdrop-filter:none}

/* NAV */
.mnav{background:transparent;border:0.5px solid var(--border);border-radius:var(--r);padding:6px 12px;font-size:14px;cursor:pointer;color:var(--text);transition:background .1s;}
.mnav.today{font-size:12px;padding:6px 12px;font-weight:500;background:transparent;color:var(--text);border-color:var(--border);max-width:80px;overflow:hidden;transform:translateX(0);transition:max-width .22s ease,opacity .22s ease,padding .22s ease,border-color .22s ease,transform .22s ease;}
.mnav.today.hide-l{max-width:0;opacity:0;padding-left:0;padding-right:0;border-color:transparent;pointer-events:none;transform:translateX(-10px);}
.mnav.today.hide-r{max-width:0;opacity:0;padding-left:0;padding-right:0;border-color:transparent;pointer-events:none;transform:translateX(10px);}
.mtit{font-size:15px;font-weight:500;cursor:pointer;padding:4px 8px;border-radius:var(--r);transition:background .1s;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
/* Titre mois/année : glisse en même temps que le calendrier, dans le sens du défilement (--md = 1 suivant, -1 précédent) */
.mtit.mt-anim{display:inline-grid}
.mtit .mt-o,.mtit .mt-n{grid-area:1/1;justify-self:center;white-space:nowrap}
/* L'ancien titre part vite (il a disparu avant que le nouveau soit lisible) : jamais les deux mots superposés */
.mtit .mt-o{pointer-events:none;animation:mtOut .14s cubic-bezier(.4,0,1,1) forwards}
.mtit .mt-n{animation:mtIn .24s cubic-bezier(0,0,.2,1) .14s both}
@keyframes mtOut{to{transform:translateX(calc(var(--md,1) * -24px));opacity:0}}
@keyframes mtIn{from{transform:translateX(calc(var(--md,1) * 24px));opacity:0}}

/* Month view */
/* Pas de fondu sur les vues : l'opacité ferait changer l'effet verre (glissements et voile à la place) */

/* Annual view */
.ann-wrap{overflow:hidden;pointer-events:none;visibility:hidden;position:absolute;top:0;left:0;right:0;width:100%;}
.ann-wrap.open{pointer-events:all;display:block;visibility:visible;overflow:visible;position:relative;}
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;width:100%;box-sizing:border-box;}
@media(max-width:600px){.annual-grid{grid-template-columns:repeat(3,1fr);}}
.ann-month{background:var(--bg0);border:1px solid var(--border2);border-radius:var(--r);padding:6px;cursor:pointer;transition:background .1s;}

.ann-month.sel{border-color:rgba(255,255,255,.38);}

.ann-month.cur-month{border-color:rgba(98,170,220,.6);}

.ann-mname{font-size:12px;font-weight:500;color:var(--text);margin-bottom:5px;}
@media(max-width:719px){.ann-month{padding:var(--ann-pad,8px)!important}.ann-mname{font-size:11px;line-height:13px;margin-bottom:4px}}
/* léger liseré sur les jours colorés, comme les cases du calendrier du mois */
.ann-day:not(.sv):not(.rh):not(.fer):not(.ec2){box-shadow:inset 0 0 0 .5px rgba(255,250,243,.16)}
.ann-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.ann-day{width:100%;height:var(--ann-d-h,auto);border-radius:3px;}
.ann-day.tv-am{background:var(--blue-l);}
.ann-day.tv-am-fer{background:var(--blue-l);outline:1.5px solid var(--gold);}
.ann-day.tv{background:var(--blue-l);}
.ann-day.tv-pm{background:var(--blue-l);}
.ann-day.tv-pm-fer{background:var(--blue-l);outline:1.5px solid var(--gold);}
.ann-day.cg{background:var(--green-l);}
.ann-day.rend{background:var(--rend-l);}
.ann-day.fer{background:transparent;outline:1.5px solid var(--gold);}
.ann-day.tv-fer{background:var(--blue-l);outline:1.5px solid var(--gold);}
.ann-day.ec{background:rgba(192,57,43,.3);}
.ann-day.ec-fer{background:rgba(192,57,43,.3);outline:1.5px solid var(--gold);}
.ann-day.tv-ov{background:rgba(192,57,43,.3);}
.ann-day.tv-ov-fer{background:rgba(192,57,43,.3);outline:1.5px solid var(--gold);}
.ann-day.ec2{background:transparent;}
.ann-day.ec2-fer{background:transparent;outline:1.5px solid var(--gold);}
.ann-day.cg-fer{background:var(--green-l);outline:1.5px solid var(--gold);}
.ann-day.rend-fer{background:var(--rend-l);outline:1.5px solid var(--gold);}
.ann-day.absent-fer{background:var(--bg3);outline:1.5px solid var(--gold);}
.ann-day.absent{background:var(--bg3);}
.ann-day.sv-vac{background:rgba(192,57,43,.3);}
.ann-day.sv-vac-fer{background:rgba(192,57,43,.3);outline:1.5px solid var(--gold);}
.ann-day.sv,.ann-day.rh{background:transparent;outline:none;}
/* Vue annuelle — Liquid Glass */
.annual-grid{gap:8px}
.ann-month{position:relative;background:rgba(255,250,242,.04);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid transparent;border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:background .15s,transform .15s}
.ann-month::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:.5px;background:linear-gradient(135deg,rgba(255,250,243,.133),rgba(255,250,243,.03) 45%,rgba(255,250,243,.094));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ann-month:active{transform:scale(.97)}
.ann-month.sel{border-color:transparent;background:rgba(255,250,242,.075)}
.ann-month.sel::after{background:linear-gradient(135deg,rgba(255,250,243,.3),rgba(255,250,243,.08) 45%,rgba(255,250,243,.2))}
.ann-month.cur-month{border-color:transparent;background:rgba(56,89,111,.16)}
.ann-month.cur-month::after{padding:1px;background:linear-gradient(135deg,rgba(98,150,190,.75),rgba(56,89,111,.35) 45%,rgba(98,150,190,.55))}
.ann-month.cur-month .ann-mname{color:#6d9cc2}
.ann-mname{font-weight:600;margin-bottom:6px;padding-left:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ann-mini{gap:2.5px}
.ann-day{border-radius:2.5px}
.ann-day.tv,.ann-day.tv-am,.ann-day.tv-pm,.ann-day.tv-fer,.ann-day.tv-am-fer,.ann-day.tv-pm-fer{background:rgba(70,116,158,.5)}

/* Calendar */
.cal-wrap{background:var(--bg0);border:0.5px solid rgba(255,255,255,.14);box-shadow:0 6px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);border-radius:var(--rl);overflow:hidden;margin-bottom:8px;width:100%;box-sizing:border-box;position:relative;}
#month-view{position:relative;width:100%;}

.cal{width:100%;border-collapse:collapse;table-layout:fixed;}
.cal th{font-size:10px;color:var(--text3);text-align:center;padding:4px 2px 3px;font-weight:400;}
.cal th.wkh{width:20px;padding:0;}
.cal td{text-align:center;padding:7px;}
/* ramtr row bg removed - only wkn.wram is colored */
.cal tr.curweek td{background:rgba(98,170,220,.06);}

/* Week number - base */
.wkn{font-size:9px;color:var(--text3);text-align:center;vertical-align:middle;width:20px;padding:1px 2px;border-radius:4px;}
/* New cycle start */
.cyc-badge{position:absolute;left:0;right:0;z-index:50;pointer-events:none;border-top:3px solid rgba(192,57,43,.55);display:flex;align-items:flex-start;transform:translateY(-1.5px);}

.cyc-label{margin-left:20px;background:rgba(192,57,43,.55);color:rgba(255,255,255,.92);font-size:8px;font-weight:600;padding:1px 7px 3px;border-radius:0 0 4px 4px;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;}

/* Exchange given-away days */
.s-ec2 .dn,.s-ec2 .dv{color:var(--red);}
/* Today outline — pseudo-element renders above .dci backgrounds */
.dc.today::after{content:'';position:absolute;inset:0;border:1.5px solid var(--blue);border-radius:var(--r);pointer-events:none;z-index:1;}
/* Colored week numbers */

.wkn.wcur{font-weight:600;}.wkn.wram{}.wkn.wcg{}


.dc{width:100%;aspect-ratio:6/5;position:relative;border-radius:var(--r);display:block;}
/* Réglage iPhone « Réduire les animations » : glissements, fondus et rebonds deviennent instantanés
   (le calendrier suit toujours le doigt pendant un geste, puisque c'est l'utilisateur qui le déplace) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Pas de détection du double-tap iOS sur le calendrier et la navigation : chaque appui rapide compte */
.cal-col,.mbar,.mnav,.ann-wrap{touch-action:manipulation}
/* Calendrier et tuiles annuelles : pas de flou d'arrière-plan. Posés sur un fond uni, il ne se voit pas,
   mais il est recalculé à chaque image quand ils glissent (très lourd sur iPhone). Fond, liseré et ombre restent. */
.cal-wrap,.ann-month{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.pg-on .cal-wrap,.pg-on .ann-month{will-change:transform}
/* Écran de chargement : silhouette aux dimensions de l'accueil (barre, mois, calendrier, cases du côté) */
@media(min-width:721px){#boot{display:none!important}}
#boot{position:fixed;inset:0;z-index:100000;background:#161615;overflow:hidden;transition:opacity .4s ease}
#boot .bt-hdr{height:39px;border-bottom:.5px solid rgba(255,250,242,.06);background:#1d1d1c;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 10px}
#boot .bt-hdr b{display:block;width:34px;height:28px;border-radius:9px;background:rgba(255,250,242,.06);animation:btPulse 1.3s ease-in-out infinite;animation-delay:var(--btd,0s)}#boot .bt-hdr b.g{width:22px;height:22px;border-radius:50%;margin-right:8px}
#boot .bt-in{max-width:520px;margin:0 auto;padding:13px 20px 0}
#boot .bt-bar{display:flex;justify-content:space-between;align-items:center;height:46px;margin-bottom:1px;position:relative}
#boot.ptr .bt-bar b.w{visibility:hidden}
.bt-ptr{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px}.bt-ptr svg{display:block}
.bt-ptr line{stroke:#6e6d72;stroke-width:3.55;stroke-linecap:round;animation:ptr-fade .8s linear infinite}
#boot .bt-bar b{width:46px;height:34px;border-radius:12px}
#boot .bt-bar b.w{width:132px;height:18px;border-radius:9px}
#boot .bt-cal{display:grid;grid-template-columns:17px repeat(7,1fr);grid-template-rows:10px;gap:7px;padding:6px 6px 10px 0;border-radius:16px;background:rgba(255,250,242,.035);border:.5px solid rgba(255,250,242,.05);margin-bottom:9px}
#boot .bt-cal u{height:10px;border-radius:5px;margin:0 25%}
#boot .bt-cal u.n{margin:0}
#boot .bt-cal em{width:12px;height:10px;border-radius:5px;align-self:center;justify-self:center}
#boot .bt-cal i{aspect-ratio:39/41;border-radius:10px}
#boot .bt-cal.fix{box-sizing:border-box;grid-template-rows:10px repeat(6,1fr)}#boot .bt-cal.fix i{aspect-ratio:auto}
#boot .bt-side[style*="--rh"]:before{bottom:auto;height:var(--rh)}
#boot .bt-side{position:relative;padding-left:43px}
#boot .bt-side:before{content:'';position:absolute;left:0;top:var(--rt,16px);bottom:24px;width:var(--rw,23px);border-radius:10px;background:rgba(255,250,242,.04)}
#boot .bt-bloc{border-radius:16px;margin-bottom:8px;padding:14px 14px 12px}
#boot .bt-bloc.a{height:95px}#boot .bt-bloc.b{height:118px}#boot .bt-bloc.c{height:77px}
#boot .bt-bar b,#boot .bt-cal u,#boot .bt-cal em,#boot .bt-cal i,#boot .bt-bloc{display:block;background:rgba(255,250,242,.06);animation:btPulse 1.3s ease-in-out infinite;animation-delay:var(--btd,0s)}
#boot .bt-cal u,#boot .bt-cal em{background:rgba(255,250,242,.045)}
#boot .bt-bloc{background:rgba(255,250,242,.045);border:.5px solid rgba(255,250,242,.05)}
#boot .bt-bloc>s{display:block;width:70px;height:10px;border-radius:5px;background:rgba(255,250,242,.07);text-decoration:none}
#boot .bt-bloc>p{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
#boot .bt-bloc>p>span{display:block;height:58px;border-radius:12px;background:rgba(255,250,242,.05)}
#boot .bt-bloc.c>p{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
#boot .bt-bloc.c>p>span{width:90px;height:12px;border-radius:6px}#boot .bt-bloc.c>p>span+span{width:110px;height:20px;border-radius:8px}
@keyframes btPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
/* Bandeau d'annulation après une action */
#undo-toast{position:fixed;left:50%;bottom:28px;z-index:450;display:flex;align-items:center;gap:14px;padding:9px 9px 9px 18px;border-radius:999px;
  background:rgba(44,44,42,.96);box-shadow:inset .5px .5px 0 rgba(255,250,243,.16),0 12px 32px rgba(0,0,0,.5);color:var(--text);font:500 14px var(--font);white-space:nowrap;
  transform:translate(-50%,calc(100% + 40px));opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.1),opacity .2s ease;pointer-events:none}
#undo-toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#undo-toast{max-width:calc(100vw - 32px);box-sizing:border-box}#undo-toast>span{overflow:hidden;text-overflow:ellipsis}
#undo-toast button{border:none;border-radius:999px;padding:7px 14px;background:rgba(98,150,190,.22);color:#8fbbe0;font:600 13px var(--font);cursor:pointer}
@media (prefers-reduced-motion:reduce){#undo-toast{transition:opacity .2s ease}}
/* Appui long sur un jour : menu rapide */
.dci{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dci.lp-on{transform:scale(1.1);z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.55)}
#lp-veil{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.18);opacity:0;transition:opacity .15s ease}
#lp-veil.on{opacity:1}

/* Jours travaillés classiques : fond bleu */

/* Modifiés / ajout / échange : fond bleu + texte turquoise */

/* Texte turquoise pour les modifs */

/* Congés et rendus : fond coloré */
.s-cg .dci{background:var(--green-l);cursor:pointer;}
.s-rend .dci{background:var(--rend-l);cursor:pointer;}


/* Autres états non-travaillés : pas de fond */
.s-rh .dci,.s-sv-ov .dci,.s-sv .dci,.s-absent .dci,.s-ec2 .dci{cursor:pointer;}
/* Textes des non-travaillés */
/* Fériés : bordure dorée, pas de fond (sauf travaillés-fériés) */
.s-fer .dci{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}

/* Travaillés classiques-fériés : fond bleu + bordure dorée */
.s-tv-fer .dci,.s-tv-am-fer .dci,.s-tv-pm-fer .dci{background:var(--blue-l);box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}

/* Modifiés-fériés : fond bleu + bordure dorée */
.s-tv-ov-fer .dci,.s-sv-vac-fer .dci,.s-ec-fer .dci{background:var(--blue-l);box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}

.s-cg-fer .dci{background:var(--green-l);box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}
.s-rend-fer .dci{background:var(--rend-l);box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}
/* Autres non-travaillés-fériés : juste bordure dorée */
.s-absent-fer .dci,.s-ec2-fer .dci{box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;}

/* ── Style Liquid Glass : blocs translucides et flous ; liseré fin dont la lumière fait le tour du bord,

/* Eph unified table */
 /* Mobile : nom du mois affiché, écrit à la verticale à gauche de la colonne */
#side-month{display:none}
@media(max-width:720px){
  .side-col{position:relative;padding-left:24px!important}
  #side-month{display:flex;align-items:center;justify-content:center;position:absolute;left:0;z-index:0;opacity:1;top:var(--rl);bottom:calc(20px + var(--rl));width:23px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;--sm-c:#52514e} /* gris foncé opaque (équivaut à l’ancien gris atténué à 45 %), pour que le contour bleu du mois actuel garde sa vivacité */
  #side-month.now{--sm-c:#38596f} /* mois actuel : bleu du jour actuel, adouci */
  /* Ligne verticale au niveau de la coupe (bord gauche local = bord droit à l'écran, l'élément étant tourné de 180°) */
  #side-month::after{content:'';position:absolute;top:0;bottom:0;left:var(--sm-cut,0px);width:1px;background:linear-gradient(to bottom,transparent,var(--sm-c) 20%,var(--sm-c) 80%,transparent);opacity:.5}
  /* Les cases passent par-dessus le bas des lettres */

  /* Lettres collées au bord des cases (côté droit de la bande = pied des lettres) */
  #side-month{justify-content:center;align-items:flex-end}
  /* Taille, largeur et retrait calculés par _fitSideMonth() ; line-height ≈ hauteur des capitales */
  #side-month .sm-txt{display:inline-block;font-size:24px;line-height:.72;font-weight:900;font-style:italic;letter-spacing:.04em;text-transform:uppercase;color:var(--sm-c);-webkit-text-stroke:2px var(--sm-s,var(--sm-c));paint-order:stroke fill;transition:color .3s}
  #side-month .sm-y{font-size:.42em;font-weight:700;-webkit-text-stroke:1px var(--sm-s,var(--sm-c));letter-spacing:.05em;color:var(--sm-c);margin-inline-start:.3em;vertical-align:-.16em;opacity:.75}
  #side-month .sm-txt.sm-in{animation:smIn .28s ease}
  #side-month .sm-txt.sm-in-rev{animation:smInRev .28s ease}
}

@keyframes smInRev{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

}
function _undoToast(label){
  var t=document.getElementById('undo-toast');
  if(!t){t=document.createElement('div');t.id='undo-toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.innerHTML='<span></span><button type="button">Annuler</button>';
  t.firstChild.textContent=label;
  t.lastChild.onclick=function(e){e.stopPropagation();undoAction();_hideUndoToast();};
  clearTimeout(window._utHide);
  requestAnimationFrame(function(){t.classList.add('on');});
  window._utHide=setTimeout(_hideUndoToast,4500);
}
function _hideUndoToast(){var t=document.getElementById('undo-toast');if(t)t.classList.remove('on');}
function undoAction(){if(!_us.length)return;_rs.push(snap());_snapApply(JSON.parse(_us.pop()));saveState();render();updateUrBtns();gcalTrigger();}

// ================================================================
// withDetail : renvoie aussi le détail jour par jour / semaine par semaine (comparaison avec le tableau RH)
function buildGen(withDetail){
  const det=withDetail?{}:null;
  const gen={};function add(ym,k,v,lbl){if(!gen[ym])gen[ym]={dim:0,rh:0,fer:0,hs:0,ram:0,extra:0,solde:0};gen[ym][k]+=v;if(det&&lbl){const dkk=ym+':'+k;(det[dkk]=det[dkk]||[]).push({lbl:lbl,v:v});}}
  const START=2026*12,maxYM=CUR_YEAR*12+11,maxYMDisplay=(CUR_YEAR+2)*12+11,VAC=getVAC();
  const createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:START;
  const solde=(S.profile&&S.profile.ephSolde)||0,split=S.profile&&S.profile.ephSoldeSplit;
  // Solde de départ : réparti par mois d'origine (repris du tableau RH) ou, à défaut, rattaché au mois précédant le suivi
  if(split&&Object.keys(split).length)Object.keys(split).forEach(function(ym){if(split[ym]>0)add(Number(ym),'solde',split[ym],'solde de départ');});
  else if(solde>0)add(createdYM>0?createdYM-1:createdYM,'solde',solde*60);
  for(let y=2025;y<=2030;y++)for(let m=0;m<12;m++){
    const ym=y*12+m;if(ym<createdYM||ym>TODAY_YM&&ym>maxYMDisplay)continue;
    const last=new Date(y,m+1,0).getDate();
    for(let d=1;d<=last;d++){const date=new Date(y,m,d),key=dk(date);const v2e=getVac(date);const{vac,absent,echange,ecSelf}=v2e;if(!vac||vac==='RH'||absent)continue;if(echange&&!ecSelf)continue;// ec2: I give away, no rendu for me
const cKey=(S.conges||{})[key];if(cKey==='rend'||cKey==='rend-hist'||cKey==='cg'||cKey==='absent')continue;// vacation posée: pas de rendu dim/fer/RH
const dur=VAC[vac]?VAC[vac].dur:0;
      const isFer2=FERIES.has(key),isDim2=date.getDay()===0,isRH2=isRHDay(date);
      const _dMon=getMonday(date);const _dSun=new Date(_dMon);_dSun.setDate(_dMon.getDate()+6);const _dSunYm=_dSun.getFullYear()*12+_dSun.getMonth();
      const sett2b=settingsForYM(_dSunYm);
      const ferF=isFer2&&sett2b.ferRendu?2.0:0;
      const dimF=(isDim2&&sett2b.dimRendu)?0.5:0;
      const rhF=(!echange&&!isDim2&&isRH2&&sett2b.rhRendu)?0.5:0;
      const totF=ferF+dimF+rhF;
      if(totF===0)continue;
      if(ferF>0)add(_dSunYm,'fer',Math.round(dur*ferF/60*100)/100*60,key);
      if(dimF>0)add(_dSunYm,'dim',Math.round(dur*dimF/60*100)/100*60,key);
      if(rhF>0)add(_dSunYm,'rh',Math.round(dur*rhF/60*100)/100*60,key);}
  }
  const seenHS=new Set();
  for(let y=2025;y<=2030;y++)for(let m=0;m<12;m++){
    const ym=y*12+m;if(ym<createdYM||ym>TODAY_YM&&ym>maxYM)continue;
    const last=new Date(y,m+1,0).getDate();
    for(let d=1;d<=last;d++){const date=new Date(y,m,d),mon=getMonday(date),mk2=dk(mon);if(seenHS.has(mk2))continue;seenHS.add(mk2);
      const sun=new Date(mon);sun.setDate(mon.getDate()+6);
      const sunYm=sun.getFullYear()*12+sun.getMonth();
      const sunInScope=sunYm>=createdYM&&(sunYm<=TODAY_YM||sunYm<=maxYM);
      if(!sunInScope)continue;
      const sett=settingsForYM(sunYm);if(!sett.hsRendu)continue;
      const hsW=calcHSWeek(mon);if(hsW.rendusMin>0){
        if(hsW.rendusMinHS>0)add(sunYm,'hs',hsW.rendusMinHS,'S'+getISOWeek(mon));
        if(hsW.rendusMinRam>0)add(sunYm,'ram',hsW.rendusMinRam,'S'+getISOWeek(mon)+' (ramenée)');
      }}
  }
  Object.keys(S.extraRendus||{}).forEach(function(key){
    var d=new Date(key+'T12:00:00'),mon=getMonday(d),sun=new Date(mon);sun.setDate(mon.getDate()+6);
    var sunYm=sun.getFullYear()*12+sun.getMonth();
    if(sunYm>=createdYM)add(sunYm,'extra',(S.extraRendus[key].dur||0),key);
  });
  return withDetail?{gen:gen,det:det}:gen;
}
// Compute potential gen for a single month with given settings (used for preview)
function buildPotentialForYM(ym,sett){
  const ty=Math.floor(ym/12),tm=ym%12;
  const VAC2=getVAC();
  const createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
  const maxYM=CUR_YEAR*12+11;
  const res={dim:0,rh:0,fer:0,hs:0,ram:0,extra:0};
  const seenHS=new Set();
  const start=new Date(ty,tm,1-6),end=new Date(ty,tm+1,0);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const mon=getMonday(new Date(d));
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const sunYm=sun.getFullYear()*12+sun.getMonth();
    if(sunYm!==ym)continue;
    const mk2=dk(mon);
    if(!seenHS.has(mk2)){
      seenHS.add(mk2);
      const sunInScope=sunYm>=createdYM&&(sunYm<=TODAY_YM||sunYm<=maxYM);
      if(sett.hsRendu&&sunInScope){const hsW=calcHSWeek(mon);if(hsW.rendusMinHS>0)res.hs+=hsW.rendusMinHS;if(hsW.rendusMinRam>0)res.ram+=hsW.rendusMinRam;}
    }
    const key=dk(d);const v2e=getVac(d);const{vac,absent,echange,ecSelf}=v2e;
    if(!vac||vac==='RH'||absent)continue;if(echange&&!ecSelf)continue;
    const cKey=(S.conges||{})[key];if(cKey==='rend'||cKey==='rend-hist'||cKey==='cg'||cKey==='absent')continue;
    const dur=VAC2[vac]?VAC2[vac].dur:0;
    const isFer=FERIES.has(key),isDim=d.getDay()===0,isRH=isRHDay(d);
    const ferF=isFer&&sett.ferRendu?2.0:0,dimF=isDim&&sett.dimRendu?0.5:0,rhF=(!echange&&!isDim&&isRH&&sett.rhRendu)?0.5:0;
    if(ferF>0)res.fer+=Math.round(dur*ferF/60*100)/100*60;
    if(dimF>0)res.dim+=Math.round(dur*dimF/60*100)/100*60;
    if(rhF>0)res.rh+=Math.round(dur*rhF/60*100)/100*60;
  }
  return res;
}

function calcSoldes(){
  const gen=buildGen(),createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
  const realEph={},prevEph={};
  for(let ym=createdYM;ym<=TODAY_YM;ym++)realEph[ym]=0;
  Object.keys(gen).forEach(ymStr=>{const ym=Number(ymStr),total=Object.values(gen[ym]).reduce((s,v)=>s+v,0),expYm=getExpYm(ym);if(ym>TODAY_YM){prevEph[ym]=total;return;}realEph[ym]=expYm<TODAY_YM?0:total;});
  // FIFO: deduct all rendus from combined stock — credit month must be <= rendu month (no borrowing from future months)
  const _fifoWarnKeys=new Set();
  const preExpiry={};
  {
    const _mK=new Set(Object.keys(S.matelasKeys||{}));
    const _rendKeys=Object.keys(S.conges||{}).filter(k=>S.conges[k]==='rend').sort();
    const _sim={};
    // Use historical gen totals (not expiry-zeroed realEph) so past rendu days consume the correct month's stock.
    // Expiry (reports included, as the RH table does) is enforced by the getExpYm(_ym)<_poseYm check in the loop below.
    Object.keys(realEph).forEach(function(ym){var ymN=Number(ym);_sim[ymN]=gen[ymN]?Object.values(gen[ymN]).reduce(function(s,v){return s+v;},0):0;});
    Object.keys(prevEph).forEach(function(ym){_sim[ym]=(_sim[ym]||0)+prevEph[ym];});
    _rendKeys.forEach(function(k){
      const _d=new Date(k+'T12:00:00'),_poseYm=_d.getFullYear()*12+_d.getMonth(),_dur=getDur(_d);
      let _left=_dur;
      const _yms=Object.keys(_sim).map(Number).sort();
      for(const _ym of _yms){
        if(_sim[_ym]<=0||getExpYm(_ym)<_poseYm||_ym>_poseYm)continue;
        const _take=Math.min(_sim[_ym],_left);_sim[_ym]-=_take;_left-=_take;
        if(_left<=0)break;
      }
      if(_left>0&&!_mK.has(k))_fifoWarnKeys.add(k);
    });
    // Capture pre-expiry balance for expired months before zeroing (needed for auto-report check)
    Object.keys(realEph).forEach(function(ym){var ymN=Number(ym);if(getExpYm(ymN)<TODAY_YM)preExpiry[ymN]=Math.max(0,_sim[ymN]||0);});
    // Apply expiry after FIFO: expired months are 0 regardless of remaining sim balance
    Object.keys(realEph).forEach(function(ym){var ymN=Number(ym);realEph[ymN]=getExpYm(ymN)<TODAY_YM?0:Math.max(0,_sim[ymN]||0);});
    Object.keys(prevEph).forEach(function(ym){prevEph[ym]=Math.max(0,(_sim[ym]||0));});
  }
  let toDeduct=0;
  const realAvail={};Object.keys(realEph).map(Number).sort().forEach(ym=>realAvail[ym]=realEph[ym]);
  for(const ym of Object.keys(realAvail).map(Number).sort()){if(toDeduct<=0)break;const take=Math.min(realAvail[ym],toDeduct);realAvail[ym]-=take;toDeduct-=take;}
  let matelas=(S.profile&&S.profile.matelas)||0;if(toDeduct>0)matelas-=toDeduct;
  return{gen,realEph,realAvail,prevEph,preExpiry,matelas,warnKeys:_fifoWarnKeys,totalReal:Object.values(realAvail).reduce((s,v)=>s+v,0),totalPrev:Object.keys(prevEph).map(Number).filter(ym=>ym<=CUR_YEAR*12+11).reduce((s,ym)=>s+(prevEph[ym]||0),0)};
}

function getSoldeAnnee(year){
  const pa=S.profile&&S.profile.congesParAnnee;
  if(pa&&pa[year]!==undefined)return pa[year];
  return 25;
}
function setSoldeAnnee(year,val){
  if(!S.profile)return;
  if(!S.profile.congesParAnnee)S.profile.congesParAnnee={};
  S.profile.congesParAnnee[year]=val;
}
function getCETForYear(year){
  if(S.profile&&S.profile.congesCET&&!S.profile.congesCETParAnnee){
    S.profile.congesCETParAnnee={};
    S.profile.congesCETParAnnee[NOW.getFullYear()]=S.profile.congesCET;
    delete S.profile.congesCET;
  }
  return((S.profile&&S.profile.congesCETParAnnee)||{})[year]||0;
}
function getCET(){
  const init=(S.profile&&S.profile.cetInit)||0;
  const pa=(S.profile&&S.profile.congesCETParAnnee)||{};
  return init+Object.values(pa).reduce(function(s,v){return s+(v||0);},0);
}

function calcCongesUsedForYear(year){
  // Filter conges keys to that year only, then apply full calcCongesUsed logic
  const allCgKeys=Object.keys(S.conges||{}).filter(k=>S.conges[k]==='cg').sort();
  const yearKeys=allCgKeys.filter(k=>k.startsWith(String(year)+'-'));
  if(!yearKeys.length)return 0;
  const cgSet=new Set(allCgKeys);// full set for écart rule

  function isFullWeekCP(monday){
    const monKey=dk(monday);
    if(!cgSet.has(monKey))return false;
    for(var i=0;i<7;i++){
      const d=new Date(monday);d.setDate(monday.getDate()+i);
      const v2=getVac(d);
      const isWorked=v2.vac&&v2.vac!=='RH'&&!v2.absent;
      if(isWorked&&!cgSet.has(dk(d)))return false;
    }
    return true;
  }
  const fullWeeks=new Set(),seenMon=new Set();let total=0;
  yearKeys.forEach(function(k){
    const d=new Date(k+'T12:00:00'),mon=getMonday(d),mk=dk(mon);
    if(seenMon.has(mk))return;seenMon.add(mk);
    if(isFullWeekCP(mon)){fullWeeks.add(mk);total+=5;}
  });
  const partialKeys=yearKeys.filter(function(k){
    const d=new Date(k+'T12:00:00');return!fullWeeks.has(dk(getMonday(d)));
  });
  if(!partialKeys.length)return total;
  function findReprise(fromDate){
    const sd=new Date(fromDate);sd.setDate(sd.getDate()+1);
    while(sd<=new Date('2031-01-01')){
      const v2=getVac(sd);if(v2.vac&&v2.vac!=='RH'&&!v2.absent)return new Date(sd);
      sd.setDate(sd.getDate()+1);}return null;
  }
  const groups={};
  partialKeys.forEach(function(k){
    const d=new Date(k+'T12:00:00'),r=findReprise(d),rk=r?dk(r):'none';
    if(!groups[rk])groups[rk]={reprise:r,dates:[]};groups[rk].dates.push(d);
  });
  Object.values(groups).forEach(function(g){
    const nb=g.dates.length;if(!g.reprise){total+=nb;return;}
    const lastCp=new Date(Math.max.apply(null,g.dates));
    const ecart=Math.round((g.reprise-lastCp)/(864e5))-1;
    total+=nb+Math.max(0,ecart-2);
  });
  return total;
}

// Jours flottants : 1 par férié tombant un dimanche, 4 max par an
function getFlottants(year){
  let n=0;
  for(const k of FERIES){if(k.startsWith(year+'')&&new Date(k+'T12:00:00').getDay()===0)n++;}
  return Math.min(4,n);
}
// Fractionnés : forfait ancienneté (3 j) + 1 j si ≥5 CG du 15/01 au 15/03 + 1 j si ≥5 CG du 15/09 au 30/11
function getFractionnes(year){
  const d1s=new Date(year,0,15),d1e=new Date(year,2,15),d2s=new Date(year,8,15),d2e=new Date(year,10,30);
  let cgWinter=0,cgAutumn=0;
  Object.keys(S.conges||{}).forEach(function(k){if(S.conges[k]!=='cg'||!k.startsWith(year+''))return;const d=new Date(k+'T12:00:00');if(d>=d1s&&d<=d1e)cgWinter++;if(d>=d2s&&d<=d2e)cgAutumn++;});
  const forfait=getFractForfait(year),base=forfait?3:0,hiver=cgWinter>=5?1:0,automne=cgAutumn>=5?1:0;
  return{forfait,base,hiver,automne,cgWinter,cgAutumn,total:base+hiver+automne};
}
// Total des droits à congés de l'année (hors CET et jours posés)
function getCongesDroits(year){return getSoldeAnnee(year)+getCongesAnc(year)+getFractionnes(year).total+getFlottants(year);}
// Congés restants de l'année : principaux + ancienneté + fractionnés + flottants − posés − versés au CET cette année-là
// (même calcul que l'affichage « Congés restants »)
function computeCongesRest(year){
  return getCongesDroits(year)-calcCongesUsedForYear(year)-getCETForYear(year);
}

function calcCongesUsed(){
  // Total tous azimuts (pour compat récap, etc.) — somme sur toutes les années présentes dans S.conges
  const allYears=[...new Set(Object.keys(S.conges||{}).filter(k=>S.conges[k]==='cg').map(k=>parseInt(k.slice(0,4))))];
  return allYears.reduce((s,y)=>s+calcCongesUsedForYear(y),0);
}

function calcCongesAncJours(years){if(years>=25)return 4;if(years>20)return 3;if(years>15)return 2;if(years>5)return 1;return 0;}
function getCongesAnc(year){const pr=S.profile||{};const ym=year*12+11;let yrs=0;if(pr.ancYears!=null&&pr.ancRefYM!=null){const anni=typeof pr.ancMoisAnni==='number'&&pr.ancMoisAnni>=0?pr.ancMoisAnni:-1;yrs=pr.ancYears;if(anni>=0){const minYM=Math.min(pr.ancRefYM,ym),maxYM=Math.max(pr.ancRefYM,ym);let cnt=0;for(let y=Math.floor(minYM/12);y<=Math.floor(maxYM/12)+1;y++){const aym=y*12+anni;if(aym>minYM&&aym<=maxYM)cnt++;}yrs=ym>=pr.ancRefYM?yrs+cnt:yrs-cnt;}yrs=Math.max(0,yrs);}else if(pr.ancYears!=null)yrs=pr.ancYears;return calcCongesAncJours(yrs);}

function getFractForfait(year){

  const _viewPast=_viewExpYM<TODAY_YM;
  [...new Set(Object.keys(realAvail).concat(Object.keys(preExpiry)))].map(Number).forEach(function(ym){
    const av=getExpYm(ym)<TODAY_YM?(preExpiry[ym]||0):(realAvail[ym]||0);

  {

    const _bFut=Object.keys(gen).map(Number).filter(ym=>ym>TODAY_YM).sort();

    const _bYmsAll=[...new Set([..._bGenPast,..._bPrev,..._bExt,..._bFut])].sort();

// Mobile : taille du mois vertical telle que « SEPTEMBRE 26 » occupe toute la hauteur des cases ;
// le bas des lettres est coupé à 8 % sous les cases, le haut reste entier.
function _fitSideMonth(){
  var el=document.getElementById('side-month'),sc=document.querySelector('.side-col');
  if(!el||!sc)return;
  if(window.innerWidth>720||!el.offsetHeight){sc.style.removeProperty('padding-left');return;}
  var txt=el.querySelector('.sm-txt');if(!txt)return;
  // Longueur de référence de « SEPTEMBRE 26 » à 100 px, mesurée une fois
  if(!_fitSideMonth._ref){
    var probe=document.createElement('span');probe.className='sm-txt';probe.style.fontSize='100px';probe.style.visibility='hidden';probe.style.position='absolute';
    probe.innerHTML='Septembre<span class="sm-y">26</span>';el.appendChild(probe);
    _fitSideMonth._ref=probe.getBoundingClientRect().height;el.removeChild(probe);
  }
  var fs=Math.max(16,Math.floor(el.offsetHeight/_fitSideMonth._ref*100));
  // Le bas des lettres (côté cases, l'élément est tourné de 180°) passe sous les cases et est coupé à 8 % ;
  // le haut (côté bord de l'écran) reste entier, avec une petite marge pour le contour.
  var cap=0.72*fs,hidden=Math.round(cap*0.08),visible=Math.round(cap)-hidden,top=5;
  txt.style.fontSize=fs+'px';
  // Un espace de 8 px sépare la ligne de coupe des cases
  sc.style.setProperty('padding-left',(top+visible+2+8)+'px','important');
  el.style.left='0px';
  el.style.width=(top+visible+2+hidden)+'px';
  el.style.setProperty('--sm-cut',hidden+'px');
  // Coupe nette du bas : le bord droit à l'écran est le bord gauche local de l'élément tourné
  el.style.clipPath='inset(0 0 0 '+hidden+'px)';
}

function _sv2Animate(v2,mym){

  Array.prototype.forEach.call(vals,function(el,i){
    var t=el.textContent.trim();now[i]=t;

  });

// Auto-report: at the start of the expiry month, if remaining balance ≤7h,
// silently extend by 1 month. Warning phase (month before): green color only.
function autoReportEph(){
  if(!S.autoExtend)S.autoExtend={};
  const saved=Object.assign({},S.autoExtend);
  Object.keys(S.autoExtend).forEach(function(k){delete S.autoExtend[k];});
  const{preExpiry}=calcSoldes();
  let changed=false;
  const manExt=S.ephExtend||{};
  const allYms=new Set([...Object.keys(saved).map(Number),...Object.keys(preExpiry).map(Number),...Object.keys(manExt).map(Number)]);
  allYms.forEach(function(ym){
    if(ym>TODAY_YM)return;
    const prevAuto=saved[ym]||0;
    const manLevel=typeof manExt[ym]==='number'?manExt[ym]:(manExt[ym]?1:0);
    const currentLevel=Math.max(prevAuto,manLevel);
    const expAtLevel=ym+3+currentLevel*3;
    if(expAtLevel>=TODAY_YM){
      // Not yet expired at current level — preserve existing auto level
      if(prevAuto>0){S.autoExtend[ym]=prevAuto;if(saved[ym]!==prevAuto)changed=true;}
      return;
    }
    // Past expiry at current level — try to escalate
    const avail=preExpiry[ym]||0;
    if(avail>0&&avail<=420&&currentLevel<3){
      S.autoExtend[ym]=currentLevel+1;
      if(saved[ym]!==currentLevel+1)changed=true;
    } else if(avail>0&&avail<=420&&currentLevel>=3){
      S.autoExtend[ym]=3;
      if(saved[ym]!==3)changed=true;
    }
  });
  if(changed){recalcAllMatelas();saveState();}
}

  }
}

function calcPaniersMois(y,m){
  let c=0;const mym=y*12+m,seenW=new Set(),last=new Date(y,m+1,0).getDate();
  for(let dd=-6;dd<last;dd++){const date=new Date(y,m,1+dd),mon=getMonday(date),mk=dk(mon);if(seenW.has(mk))continue;seenW.add(mk);const sun=new Date(mon);sun.setDate(mon.getDate()+6);if(sun.getFullYear()*12+sun.getMonth()!==mym)continue;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const key=dk(d);const _g=getVac(d);if(_g.echange&&!_g.ecSelf)continue;if(isPanier(d)&&!(S.conges||{})[key])c++;}}
  return c;
}
function calcPrimesMois(y,m){
  let antenne=0,reel=0,coord=0,matin=0;const mym=y*12+m,seenW=new Set(),last=new Date(y,m+1,0).getDate();const VAC=getVAC();
  for(let dd=-6;dd<last;dd++){const date=new Date(y,m,1+dd),mon=getMonday(date),mk=dk(mon);if(seenW.has(mk))continue;seenW.add(mk);const sun=new Date(mon);sun.setDate(mon.getDate()+6);if(sun.getFullYear()*12+sun.getMonth()!==mym)continue;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const key=dk(d);if((S.conges||{})[key])continue;const{vac,absent,echange,ecSelf}=getVac(d);if(absent)continue;if(echange&&!ecSelf)continue;if(!vac||vac==='RH')continue;const pvac=getPayVac(d);const v=VAC[pvac];if(!v)continue;if(v.deb&&_toMinApp(v.deb)<240)matin++;if(!v.primes)continue;if(v.primes.antenne)antenne++;if(v.primes.reel)reel++;if(v.primes.coord)coord++;}}

  var b={rap:[],nao:{}},N='(-?\\d+,\\d+)',m,fx=[['salQ',/^SALAIRE DE QUALIFICATION .*?(-?\d+,\d+)$/],['anc',/^PRIME ANCIENNETE .*?(-?\d+,\d+)$/],['gpe',/^INDEMNITE MENSUELLE.*?(-?\d+,\d+)$/],['pfa',/^P\.?F\.?A\b.*?(-?\d+,\d+)$/],['epv',/^INDEMNITE 10EME EPV .*?(-?\d+,\d+)$/],['supFam',/^SUPPL(?:EMENT|\.)? ?FAMILIAL.*?(-?\d+,\d+)$/],['avInd',/^PRIME AV\.? ?INDIV.*?(-?\d+,\d+)$/],['brut',/TOTAL BRUT PAYE (-?\d+,\d+)$/]];
  var reRap=new RegExp('^RAP (\\d{4})(\\d\\d) (.+?) '+N+' '+N+' '+N+'$'),rePan=new RegExp('^RAP PRIME DE PANIERS '+N+' '+N+' '+N+'$');
  lines.forEach(function(raw){
    var t=String(raw).replace(/\*/g,'').replace(/\s+/g,' ').trim();if(!t)return;
    // Relevé de présence collé à droite de la ligne (« S 16 MAI 1,00 CPACO », « J 16 JUI 1,00 ») : retiré jusqu'au bout,
    // il fausserait le dernier montant. Repéré par jour de semaine + date + mois abrégé
    t=t.replace(/ [LMJVSD] \d{1,2} (?:JANV?|F[EÉ]VR?|MARS?|AVR|MAI|JUIN?|JUIL?|AO[UÛ]T?|SEPT?|OCT|NOV|D[EÉ]C)\b.*$/,'');
    // Groupe écrit dans l'en-tête (« GRILLE DE QUALIFICATION GRP5 ») : repli si l'indemnité GPE n'est pas lue
    if(b.grp==null&&(m=/GRILLE DE QUALIFICATION.*?\bGRP ?(\d)\b/.exec(t)))b.grp=+m[1];
    if(b.ym==null&&(m=/PERIODE DE PAIE DU (\d\d)\/(\d\d)\/(\d{4})/.exec(t)))b.ym=+m[3]*12+(+m[2]-1);
    if((m=reRap.exec(t))){var k=/PANIER/i.test(m[3])?'panier':_bulKey(m[3]);if(k)b.rap.push({ym:+m[1]*12+(+m[2]-1),k:k,lbl:m[3],q:_bulNum(m[4]),pu:_bulNum(m[5]),mt:_bulNum(m[6])});return;}
    // Paniers sans mois : ceux du mois de travail (mois précédent), comme les primes
    if((m=rePan.exec(t))){var pq=_bulNum(m[1]),pm=_bulNum(m[3]);if(!b.paniers)b.paniers={q:pq,pu:_bulNum(m[2]),mt:pm};else{b.paniers.q+=pq;b.paniers.mt=Math.round((b.paniers.mt+pm)*100)/100;}b.rap.push({ym:null,k:'panier',lbl:'PRIME DE PANIERS',q:pq,pu:_bulNum(m[2]),mt:pm});return;}
    if(/^RAP /.test(t))return;
    // « ABSENCE NON REMUNEREE 160 1,00 15,548 -15,55 » : grève ou absence non payée (retenue, mois du bulletin)
    if((m=/^ABSENCE NON REMUNEREE(?: (\d+))? (\d+,\d+) (\d+,\d+) (-?\d+,\d+)$/.exec(t))){if(!b.absNR)b.absNR={q:0,mt:0,div:m[1]?+m[1]:null};b.absNR.q+=_bulNum(m[2]);b.absNR.mt=Math.round((b.absNR.mt+_bulNum(m[4]))*100)/100;return;}
    if((m=/(?:^| )MESURE NAO (.+?) (-?\d+,\d+)$/.exec(t))){b.nao[m[1]]=_bulNum(m[2]);return;}
    // « SALAIRE DE QUALIFICATION base taux montant » : base temps plein (→ palier) et taux de travail (→ contrat)
    if(b.salQBase==null&&(m=/^SALAIRE DE QUALIFICATION (\d+,\d+) (\d+,\d+) (-?\d+,\d+)$/.exec(t))){b.salQBase=_bulNum(m[1]);b.taux=_bulNum(m[2]);b.salQ=_bulNum(m[3]);return;}
    for(var i=0;i<fx.length;i++){if(b[fx[i][0]]==null&&(m=fx[i][1].exec(t))){b[fx[i][0]]=_bulNum(m[1]);if(fx[i][0]==='pfa')b.pfaMens=/\bMENS/i.test(t);return;}} // « P.F.A NAC MENS » : PFA mensuelle
  });
  if(b.ym!=null)b.rap.forEach(function(r){if(r.ym==null)r.ym=b.ym-1;});
  return b.ym!=null&&b.brut!=null?b:null;
}
function _loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  var V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return new Promise(function(res,rej){var s=document.createElement('script');s.src=V+'pdf.min.js';s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js';res(window.pdfjsLib);};s.onerror=function(){rej(new Error('pdfjs'));};document.head.appendChild(s);});
}
// Éléments de texte d'une page → lignes. Même ligne si la hauteur diffère de moins de 2,5 pt (un arrondi fixe
// coupait parfois un libellé de son montant). Texte pivoté (mention verticale dans la marge) écarté : il se collait à une ligne
function _pdfRows(items){
  var its=items.filter(function(it){return it.str&&it.str.trim()&&Math.abs(it.transform[1])<0.01&&Math.abs(it.transform[2])<0.01;})
    .map(function(it){return [it.transform[5],it.transform[4],it.str];}).sort(function(a,b){return b[0]-a[0];}),grp=[];
  its.forEach(function(it){var g=grp[grp.length-1];if(g&&g.y-it[0]<2.5)g.it.push(it);else grp.push({y:it[0],it:[it]});});
  return grp.map(function(g){return g.it.sort(function(a,b){return a[1]-b[1];}).map(function(r){return r[2];}).join(' ');});
}
// PDF → lignes de texte (regroupées par hauteur, de gauche à droite)
async function _pdfLines(file){
  var lib=await _loadPdfJs(),doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,out=[];
  for(var p=1;p<=doc.numPages;p++){
    var tc=await (await doc.getPage(p)).getTextContent();
    out=out.concat(_pdfRows(tc.items));
  }
  return out;
}

// ── Réglages de paie lus sur les bulletins : palier, contrat, groupe, ancienneté (et mois d'anniversaire) ──
function _bulPaySet(b){
  var r={},ym=b.ym,base=b.salQBase||b.salQ,t=b.taux>0?b.taux:null,k=(t||100)/100,near=function(a,v){return Math.abs(a-v)<0.02||Math.abs(a*k-v)<0.02;};
  if(base>0)for(var n=11;n<=99;n++){if(Math.abs(calcPalierSalaire(n)-base)<0.02){r.palier=n;break;}}
  if(t)r.pct=t;
  if(b.gpe>0)for(var g=1;g<=9;g++){if(near(calcGPE(g,ym),b.gpe)){r.groupe=g;break;}}
  if(r.groupe==null&&b.grp>=1&&b.grp<=9)r.groupe=b.grp;
  if(b.anc>0)for(var y=1;y<=50;y++){if(near(calcAncPrime(y,ym),b.anc)){r.anc=y;break;}}
  if(b.pfa>0&&b.pfaMens!==undefined)r.pfaMens=!!b.pfaMens;
  return r;
}

function calcNuitMinShift(v){
  if(!v||!v.deb||!v.fin)return 0;
  let deb=_toMinApp(v.deb),fin=_toMinApp(v.fin);
  if(deb===null||fin===null)return 0;
  if(fin<deb)fin+=1440;
  const n1=Math.max(0,Math.min(fin,360)-Math.max(deb,0));     // 0h-6h (matin)
  const n2=Math.max(0,Math.min(fin,1440)-Math.max(deb,1260)); // 21h-24h
  const n3=Math.max(0,Math.min(fin,1800)-Math.max(deb,1440)); // 0h-6h (après minuit)
  return n1+n2+n3;
}
function calcNuitWeek(monday){
  const VAC=getVAC();let nuit=0;
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const key=dk(d);const{vac,absent,echange,ecSelf}=getVac(d);
    if(absent)continue;
    const _cg=(S.conges||{})[key];
    if(_cg&&(_cg==='cg'||_cg==='rend'||_cg==='rend-hist'||_cg==='absent'))continue;
    if(echange&&!ecSelf)continue;
    if(!vac||vac==='RH')continue;
    // Heures de nuit : formation suivie (« Formé ») → max(vacation prévue, formation) ; sinon celles réellement faites
    nuit+=getNuitMinDay(d,VAC);
  }
  return nuit;
}
function calcNuitMois(y,m){
  const mym=y*12+m,seenW=new Set(),last=new Date(y,m+1,0).getDate();let total=0;
  for(let dd=-6;dd<last;dd++){
    const date=new Date(y,m,1+dd),mon=getMonday(date),mk=dk(mon);
    if(seenW.has(mk))continue;seenW.add(mk);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    if(sun.getFullYear()*12+sun.getMonth()!==mym)continue;
    total+=calcNuitWeek(mon);
  }
  return total;
}

function _bilanCount(y,toMonth,toDay){
  var c={jours:0,nuits:0,dim:0,fer:0,matins:0},d=new Date(y,0,1,12),end=new Date(y,toMonth,toDay,12);
  while(d<=end){
    var k=dk(d),g=getVac(d),cg=(S.conges||{})[k];
    if(!g.absent&&!(cg==='cg'||cg==='rend'||cg==='rend-hist'||cg==='absent')&&!(g.echange&&!g.ecSelf)&&g.vac&&g.vac!=='RH'){
      var V=getVAC(d)[g.vac];

      if(d.getDay()===0)c.dim++;

function _ringSvg(size,rings,wr){
  // rings : [{f:fraction (peut dépasser 1),c:couleur}], du plus grand au plus petit
  var w=size*(wr||0.105),gap=w*0.18,h='<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  rings.forEach(function(r,i){
    var rad=size/2-w/2-i*(w+gap),C=2*Math.PI*rad,f=Math.max(0,r.f||0);
    var arc=function(fr,extra){var o=C*(1-Math.min(1,fr));return '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+rad+'" fill="none" stroke="'+r.c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+o+'" data-c="'+C+'" data-o="'+o+'"'+(extra||'')+'/>';};
    h+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+rad+'" fill="none" stroke="'+r.c+'" stroke-opacity=".18" stroke-width="'+w+'"/>';
    if(f>0)h+=arc(f);
    if(f>1){
      // Tour en plus : le bout du trait porte une ombre sur le tour d'en dessous, pour qu'on voie où il s'arrête
      h+=arc(f-1,' class="ring-over"');
      var th=2*Math.PI*Math.min(f-1,1),px=size/2+rad*Math.cos(th),py=size/2+rad*Math.sin(th),fid='rsh'+(++_ringSvg.n);
      h+='<filter id="'+fid+'" x="-1" y="-1" width="3" height="3"><feDropShadow dx="'+(-Math.sin(th)*w*0.28).toFixed(2)+'" dy="'+(Math.cos(th)*w*0.28).toFixed(2)+'" stdDeviation="'+(w*0.18).toFixed(2)+'" flood-color="#000" flood-opacity=".75"/></filter>'
        +'<circle class="ring-cap" cx="'+px.toFixed(2)+'" cy="'+py.toFixed(2)+'" r="'+(w/2).toFixed(2)+'" fill="'+r.c+'" filter="url(#'+fid+')"/>';
    }
  });
  return h+'</svg>';
}

function getDayVacs(dw,allVK){
  // lun-ven: A*, B*, C*, D*, P423 (pas de s/d suffixe)
  // sam: *s ou As*
  // dim: *d ou Ad*
  var night=['D1','D2','Es','Ed','Fs','Fd','P423'];
  var week=['A1','A2','A3','B1','C1','C2'];
  var sat=['As1','As2','As3','Cs','Es','Fs'];
  var sun=['Ad1','Ad2','Ad3','Cd','Ed','Fd'];
  var base;
  if(dw===6) base=[...new Set([...sat,...night.filter(v=>!sat.includes(v))])];
  else if(dw===0) base=[...new Set([...sun,...night.filter(v=>!sun.includes(v))])];
  else base=[...new Set([...week,...night.filter(v=>!week.includes(v))])];
  var std=base.filter(v=>allVK.includes(v));
  var stdAll=[...week,...sat,...sun,...night];
  var custom=allVK.filter(v=>!stdAll.includes(v));
  return [...std,...custom];
}

// Glisser à gauche / à droite dans une fiche : go(+1) suivant, go(-1) précédent, avec l'effet de page qui glisse
// go(+1/−1) : page suivante / précédente ; back : retour (glisser vers la droite, depuis le bord gauche si go existe)
function _swipeNav(go,back){
  var sh=document.querySelector('#modal-root .sheet');if(!sh)return;
  var d=window._dayNavDir||0;window._dayNavDir=0;
  if(d){
    sh.style.animation='none';_swipeKids(sh,'none','translateX('+(d*106)+'%)');void sh.offsetWidth;
    _swipeKids(sh,'transform .3s cubic-bezier(.2,.8,.2,1)','');
    // la hauteur du fond passe en douceur de l'ancienne page à la nouvelle
    var h0=window._swH,h1=sh.offsetHeight;
    if(h0&&Math.abs(h0-h1)>1){sh.style.height=h0+'px';void sh.offsetWidth;sh.style.transition='height .3s cubic-bezier(.2,.8,.2,1)';sh.style.height=h1+'px';}
    setTimeout(function(){_swipeKids(sh,'','');sh.style.overflowX='';sh.style.height='';sh.style.transition='';},320);
  }
  var sx=0,sy=0,skip=false,lock=0;
  sh.addEventListener('touchstart',function(e){skip=!!e.target.closest('input,select,textarea')||e.touches.length>1;sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock=0;},{passive:true});
  // geste horizontal reconnu : plus de défilement vertical (sinon le contenu remonte de quelques px juste avant de glisser)
  if(go)sh.addEventListener('touchmove',function(e){if(skip||lock<0)return;var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!lock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;lock=Math.abs(dx)>Math.abs(dy)?1:-1;}
    if(lock>0&&e.cancelable)e.preventDefault();},{passive:false});
  sh.addEventListener('touchend',function(e){
    if(skip)return;
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
    if(back&&dx>0&&(!go||sx<32)){_swipeGo(-1,back);return;}
    if(go)_swipeGo(dx<0?1:-1,go);
  },{passive:true});
}

function _swipeKids(sh,tr,tf){

// Retour haptique léger : vibration sur Android ; sur iPhone (iOS 18+), cliquer le libellé d'un interrupteur « switch »
// fait jouer le retour haptique du système. Méthode de la bibliothèque ios-haptics : élément neuf à chaque fois, masqué, retiré aussitôt
function _haptic(){
  try{if(navigator.vibrate&&navigator.vibrate(8))return;}catch(e){}
  try{var l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.display='none';
    var i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);
    document.head.appendChild(l);l.click();document.head.removeChild(l);}catch(e){}
}

function recalcAllMatelas(){
  // Return all current matelas allocations to balance
  if(S.matelasKeys){Object.values(S.matelasKeys).forEach(function(v){if(S.profile)S.profile.matelas=(S.profile.matelas||0)+v;});S.matelasKeys={};}
  var _avail=(S.profile&&S.profile.matelas)||0;if(_avail<=0)return;
  var gen=buildGen();
  var createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
  var _sim={};
  for(var ym=createdYM;ym<=TODAY_YM;ym++)_sim[ym]=0;
  Object.keys(gen).forEach(function(ymStr){
    var _ym=Number(ymStr),total=Object.values(gen[_ym]).reduce(function(s,v){return s+v;},0);
    if(_ym>TODAY_YM){_sim[_ym]=total;return;}
    _sim[_ym]=total; // per-day getExpYm check (line below) handles expiry per rendu day
  });
  var _syms=Object.keys(_sim).map(Number).sort();
  var _rks=Object.keys(S.conges||{}).filter(function(k){return S.conges[k]==='rend';}).sort();
  _rks.forEach(function(k){
    var _d=new Date(k+'T12:00:00'),_pym=_d.getFullYear()*12+_d.getMonth(),_kdur=getDur(_d);
    var _lft=_kdur;
    _syms.forEach(function(_ym){if(_lft<=0||_sim[_ym]<=0||getExpYm(_ym)<_pym||_ym>_pym)return;var _tk=Math.min(_sim[_ym],_lft);_sim[_ym]-=_tk;_lft-=_tk;});
    if(_lft>0){var _use=Math.min(_lft,_avail);if(!S.matelasKeys)S.matelasKeys={};S.matelasKeys[k]=_use;S.profile.matelas=_avail-_use;_avail=S.profile.matelas;}
  });
}

function _askRemoveScope(key,type,set){

  document.getElementById('modal-root').innerHTML='<div class="overlay" onclick="if(event.target===this)openDay(\''+key+'\')"><div class="sheet">'
    +'<div class="sh"></div><div class="st">Retirer le '+what+'</div>'
    +'<div style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.45">Ce jour fait partie d’une période de '+n+' jours, du '+f(ks[0])+' au '+f(ks[n-1])+'.</div>'
    +'<button class="mb wide" style="width:100%;padding:12px;margin-bottom:8px;background:'+bg+';color:'+col+';border:none" onclick="pendingKey=\''+key+'\';removeCongé(\'one\')">Seulement le '+f(key)+'</button>'
    +'<button class="mb wide" style="width:100%;padding:12px;margin-bottom:4px" onclick="pendingKey=\''+key+'\';removeCongé(\'all\')">Toute la période ('+n+' jours)</button>'
    +'<button class="mcancel" onclick="openDay(\''+key+'\')">Annuler</button>'
    +'</div></div>';
}
function removeCongé(mode){
  const key=pendingKey;
  if(!S.conges||!key)return;
  const type=S.conges[key];
  if(!type){saveState();closeModal();render();return;}
  // Find all days of the same type connected to this day (no worked-day gap)
  // Walk backward and forward
  const toRemove=new Set([key]);
  // Walk backward
  var d=new Date(key+'T12:00:00');
  for(var i=1;i<=365;i++){
    var prev=new Date(d);prev.setDate(prev.getDate()-i);
    var pk=dk(prev);
    var v2=getVac(prev);
    var isWorked=v2.vac&&v2.vac!=='RH'&&!v2.absent;
    if(isWorked){
      if(S.conges[pk]===type)toRemove.add(pk);
      else break; // gap found
    }
  }
  // Walk forward
  var d2=new Date(key+'T12:00:00');
  for(var j=1;j<=365;j++){
    var nxt=new Date(d2);nxt.setDate(nxt.getDate()+j);
    var nk=dk(nxt);
    var v2b=getVac(nxt);
    var isWorked2=v2b.vac&&v2b.vac!=='RH'&&!v2b.absent;
    if(isWorked2){
      if(S.conges[nk]===type)toRemove.add(nk);
      else break;
    }
  }
  // Jour pris dans une période (plusieurs jours d'affilée) : on demande ce qu'il faut retirer
  if(!mode&&toRemove.size>1){_askRemoveScope(key,type,toRemove);return;}
  if(mode==='one'){toRemove.clear();toRemove.add(key);}
  pushUndo(({cg:'Congé retiré',rend:'Rendu retiré','rend-hist':'Rendu retiré',absent:'Absence retirée'})[type]+(toRemove.size>1?' ('+toRemove.size+' jours)':''));
  const _pid2=window._aid||'default';
  const _stored2=JSON.parse(localStorage.getItem('gcal_event_ids_'+_pid2)||'{}');
  toRemove.forEach(function(k){
    delete S.conges[k];removeHistoryForKey(k);
    delete _stored2[k]; // clear stored IDs so sync re-creates correctly
  });
  localStorage.setItem('gcal_event_ids_'+_pid2,JSON.stringify(_stored2));
  recalcAllMatelas();
  saveState();closeModal();render();popCell(key);
  gcalTrigger();
}

function calcDispoAtDate(targetDate){
  // Heures disponibles à targetDate :
  // - heures réelles dispo aujourd'hui, non expirées à targetDate
  // - heures futures créées avant targetDate et non expirées à targetDate
  const cs=calcSoldes();
  let dispo=0;
  // Real months: include only if not expired at targetDate
  Object.keys(cs.realAvail).forEach(function(ymStr){
    const ym=Number(ymStr);
    const avail=cs.realAvail[ym];
    if(avail<=0)return;
    const expYm=getExpYm(ym);
    const expDate=new Date(Math.floor(expYm/12),expYm%12+1,0);
    if(expDate>=targetDate)dispo+=avail;
  });
  // Future months: created before targetDate, not expired at targetDate
  Object.keys(cs.prevEph).forEach(function(ymStr){
    const ym=Number(ymStr);
    const total=cs.prevEph[ym];
    if(total<=0)return;
    const lastDayOfMonth=new Date(Math.floor(ym/12),ym%12+1,0);
    if(lastDayOfMonth>targetDate)return; // not yet created at targetDate
    const expYm=getExpYm(ym);
    const expDate=new Date(Math.floor(expYm/12),expYm%12+1,0);
    if(expDate>=targetDate)dispo+=total;
  });
  return dispo;
}

// Returns truly free ephemeral minutes for a given viewed month.
// Future rendus run with >viewedYM credits preferred first; they only fall back
// to ≤viewedYM credits when those are actually accessible (expiry >= their poseYm).
// Remaining ≤viewedYM eligible credits after all passes = dispo.
function calcTrueDispo(viewedYM){
  const gen=buildGen();
  const createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
  const _sim={};
  for(let ym=createdYM;ym<=TODAY_YM;ym++)_sim[ym]=0;
  Object.keys(gen).forEach(function(ymStr){
    const ym=Number(ymStr),total=Object.values(gen[ym]).reduce(function(s,v){return s+v;},0);
    _sim[ym]=total; // use gen totals; per-day getExpYm<_pym check handles expiry; step 3 filters by current expiry
  });
  const _all=Object.keys(S.conges||{}).filter(function(k){return S.conges[k]==='rend';}).sort();
  const _sortedYms=Object.keys(_sim).map(Number).sort();
  // Snapshot brut before step 1
  const genSnapshot=[];
  _sortedYms.forEach(function(ym){if(ym<=viewedYM&&getExpYm(ym)>=viewedYM&&_sim[ym]>0)genSnapshot.push({ym,amount:_sim[ym],expYm:getExpYm(ym)});});
  // Step 1: FIFO for rendus ≤ viewedYM (they have priority, use all ≤ their month)
  _all.filter(function(k){const d=new Date(k+'T12:00:00');return d.getFullYear()*12+d.getMonth()<=viewedYM;})
    .forEach(function(k){
      const _d=new Date(k+'T12:00:00'),_pym=_d.getFullYear()*12+_d.getMonth(),_dur=getDur(_d);
      let _lft=_dur;
      _sortedYms.forEach(function(_ym){
        if(_lft<=0||_sim[_ym]<=0||getExpYm(_ym)<_pym||_ym>_pym)return;
        const _tk=Math.min(_sim[_ym],_lft);_sim[_ym]-=_tk;_lft-=_tk;
      });
    });
  // Snapshot stock actif after step 1 (before future rendus consume any)
  let stockActif=0;
  _sortedYms.forEach(function(ym){if(ym<=viewedYM&&getExpYm(ym)>=viewedYM)stockActif+=(_sim[ym]||0);});
  const afterStep1=[];
  _sortedYms.forEach(function(ym){if(ym<=viewedYM&&getExpYm(ym)>=viewedYM&&_sim[ym]>0)afterStep1.push({ym,amount:_sim[ym],expYm:getExpYm(ym)});});
  // Step 2: Future rendus — prefer >viewedYM credits first, then fall back to ≤viewedYM
  const reservedMonths=new Set();
  const reservedDetail=[];
  _all.filter(function(k){const d=new Date(k+'T12:00:00');return d.getFullYear()*12+d.getMonth()>viewedYM;})
    .forEach(function(k){
      const _d=new Date(k+'T12:00:00'),_pym=_d.getFullYear()*12+_d.getMonth(),_dur=getDur(_d);
      let _lft=_dur;
      _sortedYms.forEach(function(_ym){
        if(_lft<=0||_sim[_ym]<=0||getExpYm(_ym)<_pym||_ym>_pym||_ym<=viewedYM)return;
        const _tk=Math.min(_sim[_ym],_lft);_sim[_ym]-=_tk;_lft-=_tk;
      });
      if(_lft>0){
        const beforeFallback=_lft;
        _sortedYms.forEach(function(_ym){
          if(_lft<=0||_sim[_ym]<=0||getExpYm(_ym)<_pym||_ym>_pym||_ym>viewedYM)return;
          const _tk=Math.min(_sim[_ym],_lft);_sim[_ym]-=_tk;_lft-=_tk;
        });
        const consumed=beforeFallback-_lft;
        if(consumed>0){reservedMonths.add(_pym);reservedDetail.push({poseYm:_pym,amount:consumed});}
      }
    });
  // Step 3: remaining ≤viewedYM credits with expiry ≥viewedYM = what's genuinely free
  let dispo=0;
  const breakdown=[];
  _sortedYms.forEach(function(ym){
    if(ym<=viewedYM&&getExpYm(ym)>=viewedYM&&_sim[ym]>0){
      dispo+=_sim[ym];
      breakdown.push({ym,amount:_sim[ym]});
    }
  });
  const reserved=Math.max(0,stockActif-dispo);
  return{total:Math.max(0,dispo),breakdown,stockActif,reserved,reservedMonths,afterStep1,reservedDetail,genSnapshot};
}

function calcSoldeRH(asOf){

}

// ============================================================
// COMPARAISON AVEC LE TABLEAU RH (fichier Excel lu sur l'appareil, rien n'est envoyé)
// ============================================================
// Lecteur .xlsx minimal : zip (méthode « deflate » via DecompressionStream) + XML de la 1re feuille
async function _xlsxRead(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
  let eocd=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('Fichier Excel illisible');
  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const entries={};
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),xlen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    entries[new TextDecoder().decode(buf.subarray(p+46,p+46+nlen))]={method,csize,off};p+=46+nlen+xlen+clen;
  }
  async function read(name){
    const e=entries[name];if(!e)return null;
    const lh=e.off,start=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true),data=buf.subarray(start,start+e.csize);
    if(e.method===0)return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Navigateur trop ancien pour lire ce fichier');
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  }
  const xml=t=>new DOMParser().parseFromString(t,'application/xml');
  const ss=[];const ssx=await read('xl/sharedStrings.xml');
  if(ssx)xml(ssx).querySelectorAll('si').forEach(si=>ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')));
  const sheetName=Object.keys(entries).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
  const doc=xml(await read(sheetName));const cells={};
  doc.querySelectorAll('c').forEach(c=>{
    const r=c.getAttribute('r'),t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=v?v.textContent:null;
    if(t==='s'&&val!==null)val=ss[+val];else if(t==='inlineStr')val=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');
    else if(t!=='str'&&val!==null&&val!==''&&!isNaN(+val))val=+val;
    if(val!==null&&val!=='')cells[r]=val;
  });
  return cells;
}
function _xlsxSplit(ref){const m=/^([A-Z]+)(\d+)$/.exec(ref);return{col:m[1],row:+m[2]};}

// Lecture du tableau RH : colonnes repérées par leur titre, totaux par leur libellé (positions variables)
function _rhParse(cells,fileName){
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  const byRow={};Object.keys(cells).forEach(r=>{const x=_xlsxSplit(r);(byRow[x.row]=byRow[x.row]||{})[x.col]=cells[r];});
  const rowsN=Object.keys(byRow).map(Number).sort((a,b)=>a-b);
  // En-tête du tableau
  let hdrRow=null;const hdrs=[]; // [{col,name}] dans l'ordre des colonnes
  const colIdx=c=>c.split('').reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);
  for(const r of rowsN){const cs=byRow[r];const k=Object.keys(cs).find(c=>typeof cs[c]==='string'&&/date acquisition/.test(norm(cs[c])));if(k){hdrRow=r;Object.keys(cs).filter(c=>typeof cs[c]==='string').sort((a,b)=>colIdx(a)-colIdx(b)).forEach(c=>hdrs.push({col:c,name:norm(cs[c])}));break;}}
  if(!hdrRow)throw new Error('Colonne « Date acquisition » introuvable : est-ce bien le tableau Gestion ?');
  const C=(name,after)=>{const st=after?hdrs.findIndex(h=>h.col===after)+1:0;const h=hdrs.slice(st).find(h=>h.name.startsWith(name));return h?h.col:null;};
  const cDate=C('date acquisition'),cNat=C('nature'),cAcq=C('acquisition'),cCons=C('consommation'),cSol=C('solde'),cVal=C('validite',cSol),cStock=C('conso sur stock'),cCom=C('commentaire');
  const cRep1=C('report 1'),cVal1=cRep1?C('validite',cRep1):null,cRep2=C('report 2'),cVal2=cRep2?C('validite',cRep2):null;
  const repMonths=v=>{if(v===undefined||v===null||v==='')return 0;const m=/(\d+)/.exec(String(v));return m?+m[1]:0;};
  // Totaux : valeur sous le libellé
  const tot={};const labels={stock2025:/^stock au/,consoStock:/^conso sur stock/,stockAct:/^stock actualise/,cumAcq:/^cumul acquisitions/,cumCons:/^cumul consommations/,cumSol:/^cumul soldes/};
  for(const r of rowsN){if(r>=hdrRow)break;const cs=byRow[r];Object.keys(cs).forEach(c=>{if(typeof cs[c]!=='string')return;const n=norm(cs[c]);Object.keys(labels).forEach(k=>{if(tot[k]===undefined&&labels[k].test(n)){const below=(byRow[r+1]||{})[c];if(typeof below==='number')tot[k]=below;}});});}
  // Date d'édition : la plus récente des dates en haut du fichier, sinon le nom du fichier
  let edition=null;
  for(const r of rowsN){if(r>=hdrRow)break;Object.values(byRow[r]).forEach(v=>{if(typeof v==='number'&&v>40000&&v<70000){const d=_xlsxDate(v);if(!edition||d>edition)edition=d;}});}
  const fm=/(\d{2})-(\d{2})-(\d{4})/.exec(fileName||'');if(fm){const d=new Date(+fm[3],+fm[2]-1,+fm[1]);if(!edition||Math.abs(d-edition)>864e5*40)edition=d;}
  if(!edition)edition=new Date();
  // Lignes
  const lines=[];
  for(const r of rowsN){if(r<=hdrRow)continue;const cs=byRow[r];const dv=cs[cDate];if(typeof dv!=='number')continue;
    const d=_xlsxDate(dv),ym=d.getUTCFullYear()*12+d.getUTCMonth();const h=v=>typeof v==='number'?Math.round(v*60*1e4)/1e4:0; // minutes exactes (le tableau compte en heures décimales)
    const dt=c=>c&&typeof cs[c]==='number'?_xlsxDate(cs[c]):null;
    const r1=cRep1?repMonths(cs[cRep1]):0,r2=cRep2?repMonths(cs[cRep2]):0;
    lines.push({ym,nature:cNat&&cs[cNat]?String(cs[cNat]).trim():'',acq:h(cs[cAcq]),cons:h(cs[cCons]),solde:h(cs[cSol]),stock:cStock?h(cs[cStock]):0,

function canPlaceRendu(newKeys){
  // Double FIFO: compare existing-only deficit vs existing+new deficit.
  // Blocks if new keys are uncovered OR if they increase existing rendus' deficit.
  function _fifo(allKeys,trackSet){
    const gen=buildGen();
    const createdYM=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
    const _sim={};
    for(let ym=createdYM;ym<=TODAY_YM;ym++)_sim[ym]=0;
    Object.keys(gen).forEach(function(ymStr){
      const ym=Number(ymStr),total=Object.values(gen[ym]).reduce(function(s,v){return s+v;},0);
      _sim[ym]=total; // use gen totals; per-day expiry check handles expiry
    });
    let tracked=0,other=0;
    allKeys.forEach(function(k){
      const _d=new Date(k+'T12:00:00'),_pym=_d.getFullYear()*12+_d.getMonth(),_dur=getDur(_d);
      let _lft=_dur;
      Object.keys(_sim).map(Number).sort().forEach(function(_ym){
        if(_lft<=0||_sim[_ym]<=0||getExpYm(_ym)<_pym||_ym>_pym)return;
        const _tk=Math.min(_sim[_ym],_lft);_sim[_ym]-=_tk;_lft-=_tk;
      });
      if(_lft>0){if(trackSet&&trackSet.has(k))tracked+=_lft;else other+=_lft;}
    });
    return{tracked,other};
  }
  const _newSet=new Set(newKeys);
  const _existing=Object.keys(S.conges||{}).filter(function(k){return S.conges[k]==='rend'&&!_newSet.has(k);}).sort();
  const baseline=_fifo(_existing,null);
  const withNew=_fifo([..._existing,...newKeys].sort(),_newSet);
  // Deficit = uncovered new keys + additional burden placed on existing rendus
  return withNew.tracked+Math.max(0,withNew.other-baseline.other);
}

function applyPose(type,startKey,unique){
  const endKey=unique?startKey:(document.getElementById('pose-until').value||startKey);
  const start=new Date(startKey+'T12:00:00');
  const end=new Date(endKey+'T12:00:00');

  // Conflict check: rend ↔ cg
  if(type==='cg'||type==='rend'){
    const _oppT=type==='cg'?['rend','rend-hist']:['cg'];
    var _cf=[];var _dCf=new Date(start);
    while(_dCf<=end){const _kCf=dk(_dCf),_vCf=getVac(_dCf);if(_vCf.vac&&_vCf.vac!=='RH'&&!_vCf.absent){const _exCf=(S.conges||{})[_kCf];if(_oppT.indexOf(_exCf)>=0)_cf.push(_kCf);}_dCf.setDate(_dCf.getDate()+1);}
    if(_cf.length>0){const _oppLbl=type==='cg'?'rendu':'congé';showBlockAlert('Conflit',_cf.length+' jour'+(_cf.length>1?'s':'')+' déjà posé'+(_cf.length>1?'s':'')+' comme '+_oppLbl+'. Les supprimer avant de continuer.');return;}
  }
  // Absence sur des jours déjà en congé ou en rendu : les remplacer seulement après confirmation
  if(type==='absent'){var _ab=0,_dAb=new Date(start);while(_dAb<=end){const _x=(S.conges||{})[dk(_dAb)];if(_x==='cg'||_x==='rend'||_x==='rend-hist')_ab++;_dAb.setDate(_dAb.getDate()+1);}
    if(_ab&&!confirm(_ab+' jour'+(_ab>1?'s':'')+' déjà posé'+(_ab>1?'s':'')+' en congé ou en rendu ser'+(_ab>1?'ont':'a')+' remplacé'+(_ab>1?'s':'')+' par l’absence. Continuer ?'))return;}

  // Solde check: congés
  if(type==='cg'){
    const _cgByY={};var _dCg=new Date(start);
    while(_dCg<=end){const _kCg=dk(_dCg),_vCg=getVac(_dCg);if(_vCg.vac&&_vCg.vac!=='RH'&&!_vCg.absent&&(S.conges||{})[_kCg]!=='cg'){const _yCg=_dCg.getFullYear();_cgByY[_yCg]=(_cgByY[_yCg]||0)+1;}_dCg.setDate(_dCg.getDate()+1);}
    var _cgShort=0,_cgShortY=null;
    // Pose simulée puis annulée : le décompte réel (semaine entière = 5 j, jours d'écart) peut dépasser le nombre de jours travaillés
    var _cgSim=[];_dCg=new Date(start);while(_dCg<=end){const _k=dk(_dCg),_v=getVac(_dCg);if(_v.vac&&_v.vac!=='RH'&&!_v.absent&&(S.conges||{})[_k]!=='cg'){_cgSim.push([_k,(S.conges||{})[_k]]);if(!S.conges)S.conges={};S.conges[_k]='cg';}_dCg.setDate(_dCg.getDate()+1);}
    var _cgAfter={};Object.keys(_cgByY).forEach(function(_y2){_cgAfter[_y2]=computeCongesRest(Number(_y2));});
    _cgSim.forEach(function(x){if(x[1]===undefined)delete S.conges[x[0]];else S.conges[x[0]]=x[1];});
    Object.keys(_cgAfter).forEach(function(_y2){if(_cgAfter[_y2]<0){_cgShort=-_cgAfter[_y2];_cgShortY=Number(_y2);}});
    if(_cgShort>0){showBlockAlert('Solde insuffisant','Il manque '+_cgShort+' jour'+(_cgShort>1?'s':'')+' pour '+_cgShortY+'. Disponible : '+Math.max(0,computeCongesRest(_cgShortY))+' j.');return;}
  }

  // Validate rendus: full FIFO simulation including new days
  if(type==='rend'){
    const _createdYM_v=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
    var totalRend=0;
    var _newKeys=[];
    var d0=new Date(start);
    while(d0<=end){
      const v2=getVac(d0);
      if(v2.vac&&v2.vac!=='RH'&&!v2.absent){
        const _d0ym=d0.getFullYear()*12+d0.getMonth();
        if(_d0ym>=_createdYM_v&&_rendStatus(dk(d0))==='rend'){totalRend+=getDur(d0);_newKeys.push(dk(d0));}
      }
      d0.setDate(d0.getDate()+1);
    }
    if(totalRend>0){
      const deficit=canPlaceRendu(_newKeys);
      if(deficit>0){
        const matelasAvail=(S.profile&&S.profile.matelas)||0;
        const canMatelas=matelasAvail>0&&deficit<=matelasAvail;
        const matelasBtn=canMatelas?'<button class="mb" style="background:rgba(220,160,30,.18);color:var(--amber);border-color:transparent;flex:1" onclick="_applyPoseMatelas(\''+type+'\',\''+startKey+'\',\''+endKey+'\')">Matelas <span style="font-size:11px;opacity:.8">('+fmtMin(matelasAvail)+')</span></button>':'';
        const btnsRow=canMatelas
          ?'<div style="display:flex;gap:8px">'+matelasBtn+'<button class="mb" style="flex:1" onclick="if(pendingKey)openDay(pendingKey);else closeModal()">Retour</button></div>'
          :'<button class="mb wide" onclick="if(pendingKey)openDay(pendingKey);else closeModal()">Retour</button>';
        document.getElementById('modal-root').innerHTML='<div class="overlay" style="z-index:400"><div class="sheet" style="max-height:260px"><div class="sh"></div>'
          +'<div class="st" style="color:var(--rend-text)">Rendus insuffisants</div>'
          +'<div class="ss" style="margin-bottom:16px">Il manque <b>'+fmtMin(deficit)+'</b> pour poser cette période.<br>Nécessaire : '+fmtMin(totalRend)+'</div>'
          +btnsRow
          +'</div></div>';
        return;
      }
    }

  }

  var _xg=((document.getElementById('_exc-gv')||{}).dataset||{}).v||'j',_xm=type==='absent'?((document.getElementById('_exc-m')||{}).value||''):'',_xr=((document.getElementById('_exc-r')||{}).dataset||{}).v||'work',_xh=!!(EXC_M[_xm]&&EXC_M[_xm].half);
  pushUndo((type==='cg'?(unique?'Congé posé':'Congés posés'):type==='rend'?(unique?'Rendu posé':'Rendus posés'):_xm?'Congé exceptionnel posé':'Absence posée'));
  if(_xm&&!S.excInfo)S.excInfo={};
  if(!S.conges)S.conges={};if(!S.overrides)S.overrides={};
  const _createdYM_w=(S.profile&&S.profile.ephSoldeCreatedYM!==undefined)?S.profile.ephSoldeCreatedYM:2026*12;
  var d=new Date(start);
  while(d<=end){
    const k=dk(d);
    const v2=getVac(d);
    const isWorked=v2.vac&&v2.vac!=='RH'&&!v2.absent;
    if(isWorked){
      if(type==='absent'&&EXC_M[_xm]&&EXC_M[_xm].greve&&_xg!=='j'){S.excInfo[k]={m:_xm,g:_xg};delete S.conges[k];}
      else if(type==='absent'&&_xh){S.excInfo[k]={m:_xm,half:1,rest:_xr};if(_xr==='rend')S.conges[k]=_rendStatus(k);else delete S.conges[k];}
      else if(type==='absent'){S.overrides[k]={absent:true};S.conges[k]='absent';if(_xm)S.excInfo[k]=EXC_M[_xm].greve?{m:_xm,g:'j'}:{m:_xm};else if(S.excInfo)delete S.excInfo[k];}
      else if(type==='rend'){S.conges[k]=_rendStatus(k);if(S.excInfo)delete S.excInfo[k];}
      else{S.conges[k]=type;if(S.excInfo)delete S.excInfo[k];}
    }
    d.setDate(d.getDate()+1);
  }
  const label=type==='cg'?'congé':type==='rend'?'rendu':_xm?EXC_M[_xm].l.toLowerCase()+(EXC_M[_xm]&&EXC_M[_xm].greve?' ('+({h:'1 heure',dj:'½ journée',j:'journée'})[_xg]+')':'')+(_xh?' (½'+(_xr==='rend'?' + rendu)':')'):''):'absent';
  const color=type==='cg'?'#6a9878':type==='rend'?'#A8BF7A':'#c88048';
  logH(fmtDate(start)+' -> '+label+(unique?'':' au '+fmtDate(end)),color,startKey);
  saveState();closeModal();render();
  gcalTrigger();
}

function computeSettForProfile(pr,targetYM,key){
  var ss=pr&&pr.settings?pr.settings:{};
  var base=ss[key]!==false;
  var hist=ss.settingsHistory||[];
  var active=null;
  for(var h of hist){var p2=h.since||'';if(!p2)continue;var py=parseInt(p2.split('-')[0]),pm=parseInt(p2.split('-')[1])-1;var hym=py*12+pm;if(hym<=targetYM)active=h;}
  return active?active[key]!==false:base;
}

function cancelExchange(key){
  if(!S.overrides)return;
  pushUndo('Échange annulé');
  // Find the partner key: look for ec2 (the day we gave away) or ec (the day we took)
  const ov1=S.overrides[key];
  if(!ov1||!ov1.echange)return;
  delete S.overrides[key];
  // Partenaire de l'échange : lien enregistré (pair) ; anciens échanges sans lien : tous ceux de la semaine
  if(ov1.pair){const p=S.overrides[ov1.pair];if(p&&p.echange&&ov1.pair!==key){gcalClearDateId(ov1.pair);delete S.overrides[ov1.pair];}}
  const date=new Date(key+'T12:00:00'),mon=getMonday(date);
  if(!ov1.pair)for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const dk2=dk(d);
    const ov2=(S.overrides||{})[dk2];
    if(ov2&&ov2.echange){gcalClearDateId(dk2);if(dk2!==key)delete S.overrides[dk2];}
  }
  gcalClearDateId(key);delete S.overrides[key];
  removeHistoryForKey(key);
  saveState();closeModal();render();popCell(key);
  gcalTrigger();
}

function calcCongesUsedForKeys(monthKeys,allCgKeys){
  // Count CP for a specific set of days, using full ecart rule but limited to these keys
  if(!monthKeys.length)return 0;
  const cgSet=new Set(allCgKeys);
  const seenMon=new Set();let total=0;const fullWeeks=new Set();
  monthKeys.forEach(function(k){
    const d=new Date(k+'T12:00:00'),mon=getMonday(d),mk=dk(mon);
    if(seenMon.has(mk))return;seenMon.add(mk);
    if(!cgSet.has(mk))return;
    // Only count full week if monday is in this month (avoids double-counting cross-month weeks)
    const monM=mon.getFullYear()*12+mon.getMonth();
    const dayM=d.getFullYear()*12+d.getMonth();
    if(monM!==dayM)return; // monday in different month — will be counted there
    let ok=true;
    for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);const v2=getVac(dd);if(v2.vac&&v2.vac!=='RH'&&!v2.absent&&!cgSet.has(dk(dd))){ok=false;break;}}
    if(ok){fullWeeks.add(mk);total+=5;}
  });
  const partial=monthKeys.filter(k=>{
    const mk=dk(getMonday(new Date(k+'T12:00:00')));
    // Exclude days whose week was already counted as a full week (even from another month)
    if(fullWeeks.has(mk))return false;
    // Also check if this week is a full week globally (counted in a previous month)
    const mon=getMonday(new Date(k+'T12:00:00'));
    let ok=true;
    for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);const v2=getVac(dd);if(v2.vac&&v2.vac!=='RH'&&!v2.absent&&!cgSet.has(dk(dd))){ok=false;break;}}
    return ok===false; // only include in partial if week is NOT full
  });
  function fR(from){const sd=new Date(from);sd.setDate(sd.getDate()+1);while(sd<=new Date('2031-01-01')){const v2=getVac(sd);if(v2.vac&&v2.vac!=='RH'&&!v2.absent)return new Date(sd);sd.setDate(sd.getDate()+1);}return null;}
  const groups={};
  partial.forEach(function(k){const d=new Date(k+'T12:00:00'),r=fR(d),rk=r?dk(r):'none';if(!groups[rk])groups[rk]={reprise:r,dates:[]};groups[rk].dates.push(d);});
  Object.values(groups).forEach(function(g){
    const nb=g.dates.length;if(!g.reprise){total+=nb;return;}
    const lc=new Date(Math.max.apply(null,g.dates));
    total+=nb+Math.max(0,Math.round((g.reprise-lc)/(864e5))-1-2);
  });
  return total;
}

// Hauteur des fenêtres animée : quand le contenu d'une fenêtre change de taille, ou quand une fenêtre en remplace une autre
// (fiche du jour → Rendu…), la hauteur glisse de l'ancienne à la nouvelle au lieu de sauter
(function(){
  var root=null,ro=null,cur=null,lastH=0,anim=false,EASE='cubic-bezier(.32,.72,0,1)';

    setTimeout(function(){sh.style.transition='';sh.style.height='';anim=false;lastH=sh.offsetHeight;},320);};
  var watch=function(sh){if(ro)ro.disconnect();cur=sh;if(!sh)return;ro=new ResizeObserver(function(){if(anim||cur!==sh)return;var h=sh.offsetHeight;if(lastH&&h)slide(sh,lastH,h);lastH=h;});ro.observe(sh);};

      var sh=root.querySelector('.sheet');
      if(!sh){watch(null);lastH=0;return;}
      if(sh===cur)return;
      // fenêtre remplacée par une autre dans le même geste : pas de nouvelle montée, la hauteur glisse
      var replaced=recs.some(function(r){return r.removedNodes.length&&r.addedNodes.length;})&&lastH>0;
      var from=lastH;watch(null);
      if(replaced){var ov=root.querySelector('.overlay');if(ov)ov.style.animation='none';sh.style.animation='none';var to=sh.offsetHeight;lastH=to;slide(sh,from,to);}

})();
